regation\": \"mean\"\\n }\\n },\\n \"source\": {\\n \"__init__.py\": \"\\\\\"\\\\\"\\\\\"Small, explicit tools for the REACT 2026 Datathon.\\\\\"\\\\\"\\\\\"\\\\n\",\\n \"audit.py\": \"\\\\\"\\\\\"\\\\\"Descriptive audit only: never fit a model, infer test labels, or change configuration.\\\\\"\\\\\"\\\\\"\\\\nif __package__ in {None, \\\\\"\\\\\"}:\\\\n import sys\\\\n from pathlib import Path\\\\n sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\\\\n __package__ = \\\\\"src\\\\\"\\\\n\\\\nimport argparse\\\\nfrom datetime import datetime, timezone\\\\nimport json\\\\nfrom pathlib import Path\\\\nimport re\\\\nimport numpy as np\\\\nimport pandas as pd\\\\nfrom .config import ROOT, load_config\\\\nfrom .data import TABLE_SUFFIXES, read_table\\\\n\\\\n\\\\ndef sampled_table(path, limit, seed):\\\\n \\\\\"\\\\\"\\\\\"CSV/TSV/JSONL: scan rows, retain a bounded uniform priority sample.\\\\\"\\\\\"\\\\\"\\\\n suffix = path.suffix.lower()\\\\n if limit is None or suffix not in {\\\\\".csv\\\\\", \\\\\".tsv\\\\\", \\\\\".jsonl\\\\\"}:\\\\n frame = read_table(path)\\\\n total = len(frame)\\\\n return (frame.sample(n=limit, random_state=seed).sort_index() if limit and total > limit else frame), total\\\\n chunks = (pd.read_json(path, lines=True, chunksize=50000) if suffix == \\\\\".jsonl\\\\\" else\\\\n pd.read_csv(path, sep=\\\\\"\\\\\\\\t\\\\\" if suffix == \\\\\".tsv\\\\\" else \\\\\",\\\\\", chunksize=50000))\\\\n rng, sample, keys, total = np.random.default_rng(seed), None, np.array([]), 0\\\\n for chunk in chunks:\\\\n total += len(chunk)\\\\n sample = chunk if sample is None else pd.concat([sample, chunk])\\\\n keys = np.concatenate([keys, rng.random(len(chunk))])\\\\n if len(sample) > limit:\\\\n selected = np.argpartition(keys, limit - 1)[:limit]\\\\n sample, keys = sample.iloc[selected], keys[selected]\\\\n return (sample.sort_index() if sample is not None else read_table(path)), total\\\\n\\\\n\\\\ndef clean_nested(frame):\\\\n frame = frame.copy()\\\\n for column in frame.select_dtypes(include=[\\\\\"object\\\\\"]).columns:\\\\n frame[column] = frame[column].map(lambda x: json.dumps(x, sort_keys=True) if isinstance(x, (dict, list)) else x)\\\\n return frame\\\\n\\\\n\\\\ndef id_candidates(frame):\\\\n return [str(c) for c in frame if re.search(r\\\\\"(^id$|_id$|^id_|uuid|^index$|^unnamed:|_key$)\\\\\", str(c), re.I)]\\\\n\\\\n\\\\ndef brief(value):\\\\n return str(value).replace(\\\\\"\\\\\\\\n\\\\\", \\\\\" \\\\\").replace(\\\\\"|\\\\\", \\\\\"\\\\\\\\\\\\\\\\|\\\\\")[:180]\\\\n\\\\n\\\\ndef audit(root=ROOT, *, config=None, full=False, max_rows=100000, seed=42):\\\\n root = Path(root)\\\\n if max_rows < 1:\\\\n raise ValueError(\\\\\"max_rows must be positive\\\\\")\\\\n raw = root / \\\\\"data/raw\\\\\"\\\\n paths = sorted(p for p in raw.rglob(\\\\\"*\\\\\") if p.is_file() and p.name != \\\\\".gitkeep\\\\\") if raw.exists() else []\\\\n lines = [\\\\\"# Data audit\\\\\", \\\\\"\\\\\", f\\\\\"Generated: {datetime.now(timezone.utc).isoformat()}\\\\\",\\\\n \\\\\"\\\\\", \\\\\"Diagnostics only. No features are removed, no model is fitted, and no test labels are inferred.\\\\\",\\\\n f\\\\\"Default sample cap: {max_rows}; mode: {\\'FULL\\' if full else \\'bounded deterministic sample\\'}; seed: {seed}.\\\\\",\\\\n \\\\\"Counts and distributions below refer to analyzed rows unless explicitly called exact file totals.\\\\\",\\\\n \\\\\"JSON, Parquet, and Excel readers may load a complete table before sampling; CSV/TSV/JSONL use bounded samples.\\\\\", \\\\\"\\\\\", \\\\\"## File inventory\\\\\"]\\\\n tables, risks = {}, []\\\\n for path in paths:\\\\n lines.append(f\\\\\"- {path.relative_to(root)}: {path.stat().st_size:,} bytes\\\\\")\\\\n if not paths:\\\\n lines.append(\\\\\"No competition files found. Place organizer-provided files in data/raw/ after launch.\\\\\")\\\\n if config:\\\\n for name in (\\\\\"train_file\\\\\", \\\\\"test_file\\\\\", \\\\\"sample_file\\\\\"):\\\\n value = getattr(config, name)\\\\n if value:\\\\n path = config.path(root, value).resolve()\\\\n if path not in [p.resolve() for p in paths]:\\\\n paths.append(path)\\\\n lines.append(f\\\\\"- Explicit {name}: {path}\\\\\")\\\\n for path in paths:\\\\n if path.suffix.lower() not in TABLE_SUFFIXES:\\\\n lines.append(f\\\\\"- {path.name}: inventory only (media/archive/unsupported format); not extracted.\\\\\")\\\\n continue\\\\n try:\\\\n frame, total = sampled_table(path, None if full else max_rows, seed)\\\\n frame = clean_nested(frame)\\\\n configured_target = getattr(config, \\\\\"target\\\\\", None) if config else None\\\\n explicit_test = getattr(config, \\\\\"test_file\\\\\", None) if config else None\\\\n is_test = (path.resolve() == config.path(root, explicit_test).resolve()) if explicit_test else bool(re.fullmatch(r\\\\\"test|testing\\\\\", path.stem, re.I))\\\\n if is_test and configured_target and configured_target in frame:\\\\n lines.append(f\\\\\"- {path.name}: configured target column is present in the test file. Its values were excluded from all diagnostics; investigate the file role/schema before proceeding.\\\\\")\\\\n risks.append((\\\\\"CRITICAL\\\\\", f\\\\\"{path.name}: configured target appears in test schema; do not inspect or use its values\\\\\"))\\\\n frame = frame.drop(columns=[configured_target])\\\\n tables[path.resolve()] = frame\\\\n sampled = len(frame) < total\\\\n scope = \\\\\"SAMPLED: duplicate counts are lower bounds; absence is not established\\\\\" if sampled else \\\\\"COMPLETE TABLE\\\\\"\\\\n lines += [\\\\\"\\\\\", f\\\\\"## {path.name}\\\\\", f\\\\\"Exact file rows: {total:,}; columns: {len(frame.columns)}; analyzed rows: {len(frame):,}. {scope}.\\\\\",\\\\n f\\\\\"Analyzed memory: {frame.memory_usage(deep=True).sum():,} bytes.\\\\\",\\\\n f\\\\\"Columns: {brief(list(frame.columns))}\\\\\", f\\\\\"Candidate IDs/keys (name heuristic): {id_candidates(frame)}\\\\\",\\\\n f\\\\\"Exact duplicate rows in analyzed data: {int(frame.duplicated().sum())}\\\\\",\\\\n \\\\\"\\\\\", \\\\\"| Column | Type | Missing count (%) | Unique (ratio) | Signals |\\\\\", \\\\\"|---|---|---|---|---|\\\\\"]\\\\n for column in frame:\\\\n series = frame[column]\\\\n missing, unique = int(series.isna().sum()), int(series.nunique())\\\\n ratio = unique / max(len(series), 1)\\\\n top = series.value_counts(normalize=True, dropna=False)\\\\n signals = []\\\\n numeric = pd.api.types.is_numeric_dtype(series)\\\\n if unique <= 1:\\\\n signals.append(\\\\\"constant\\\\\")\\\\n risks.append((\\\\\"LOW\\\\\", f\\\\\"{path.name}.{column}: constant/all-missing in analyzed rows\\\\\"))\\\\n elif len(top) and top.iloc[0] >= .99:\\\\n signals.append(\\\\\"near-constant (>=99%)\\\\\")\\\\n signals.append(\\\\\"likely categorical\\\\\" if not numeric or unique <= 20 else \\\\\"likely numeric/continuous; confirm semantics\\\\\")\\\\n if not numeric and unique > 100:\\\\n signals.append(\\\\\"high cardinality\\\\\")\\\\n if ratio > .98:\\\\n signals.append(\\\\\"near-unique; possible identifier\\\\\")\\\\n name = str(column)\\\\n if re.search(r\\\\\"date|time|timestamp|year|month\\\\\", name, re.I):\\\\n signals.append(\\\\\"possible time structure\\\\\")\\\\n risks.append((\\\\\"HIGH\\\\\", f\\\\\"{path.name}.{column}: possible time field; random CV may train on future observations\\\\\"))\\\\n if re.search(r\\\\\"user|customer|patient|device|machine|entity|session|account\\\\\", name, re.I):\\\\n signals.append(\\\\\"possible entity/group\\\\\")\\\\n risks.append((\\\\\"HIGH\\\\\", f\\\\\"{path.name}.{column}: possible repeated entity ({len(series)-unique} repeated/nonunique rows including missing); investigate group isolation\\\\\"))\\\\n if re.search(r\\\\\"lat|lon|country|city|region|postal|location|geo\\\\\", name, re.I):\\\\n signals.append(\\\\\"possible geography\\\\\")\\\\n if re.search(r\\\\\"sequence|order|index|unnamed|uuid|encoded\\\\\", name, re.I):\\\\n risks.append((\\\\\"MEDIUM\\\\\", f\\\\\"{path.name}.{column}: index/order/encoded ID may reveal collection structure\\\\\"))\\\\n lines.append(f\\\\\"| {brief(column)} | {series.dtype} | {missing} ({100*missing/max(len(series),1):.2f}%) | {unique} ({ratio:.3f}) | {\\', \\'.join(signals)} |\\\\\")\\\\n patterns = frame.isna().astype(int).astype(str).agg(\\\\\"\\\\\".join, axis=1).value_counts().head(5) if len(frame) else pd.Series(dtype=int)\\\\n lines.append(f\\\\\"\\\\\\\\nTop missingness masks (1=missing, column order above): {brief(patterns.to_dict())}\\\\\")\\\\n candidate_features = [c for c in frame if c not in id_candidates(frame) and c != configured_target]\\\\n if candidate_features:\\\\n lines.append(f\\\\\"Duplicate candidate-feature rows excluding named ID candidates and any configured target: {int(frame.duplicated(candidate_features).sum())}; confirm feature roles before interpretation.\\\\\")\\\\n for column in frame:\\\\n series = frame[column]\\\\n if column in id_candidates(frame):\\\\n count = int(series.duplicated(keep=False).sum())\\\\n lines.append(f\\\\\"- {column}: rows with duplicated candidate ID, including missing: {count}\\\\\")\\\\n if pd.api.types.is_numeric_dtype(series):\\\\n clean = series.replace([np.inf, -np.inf], np.nan).dropna()\\\\n stats = clean.describe(percentiles=[.01, .05, .25, .5, .75, .95, .99]).to_dict()\\\\n q1, q3 = clean.quantile(.25), clean.quantile(.75)\\\\n extremes = int(((clean < q1 - 3*(q3-q1)) | (clean > q3 + 3*(q3-q1))).sum())\\\\n lines.append(f\\\\\"- Numeric {column}: {stats}; skew={clean.skew()}; 3-IQR extremes={extremes}; nonfinite={int(np.isinf(series.to_numpy(dtype=float, na_value=np.nan)).sum())}.\\\\\")\\\\n else:\\\\n counts = series.value_counts()\\\\n lines.append(f\\\\\"- Categorical {column}: common={brief(counts.head(10).to_dict())}; singleton values={int((counts == 1).sum())}; rare examples={brief(counts[counts <= 2].head(10).to_dict())}.\\\\\")\\\\n except (ValueError, OSError, ImportError, TypeError) as exc:\\\\n lines.append(f\\\\\"- Could not analyze {path.name}: {type(exc).__name__}: {exc}\\\\\")\\\\n def role(name, pattern):\\\\n explicit = getattr(config, name, None) if config else None\\\\n if explicit:\\\\n return tables.get(config.path(root, explicit).resolve())\\\\n candidates = [frame for path, frame in tables.items() if re.fullmatch(pattern, path.stem, re.I)]\\\\n if len(candidates) != 1:\\\\n lines.append(f\\\\\"{name}: {\\'ambiguous\\' if candidates else \\'unavailable\\'}; configure its path explicitly.\\\\\")\\\\n return None\\\\n return candidates[0]\\\\n lines += [\\\\\"\\\\\", \\\\\"## Roles, target, and train/test diagnostics\\\\\"]\\\\n train, test, sample = role(\\\\\"train_file\\\\\", r\\\\\"train|training\\\\\"), role(\\\\\"test_file\\\\\", r\\\\\"test|testing\\\\\"), role(\\\\\"sample_file\\\\\", r\\\\\"sample_submission|samplesubmission\\\\\")\\\\n if sample is not None:\\\\n lines.append(f\\\\\"Sample submission schema: {dict(sample.dtypes.astype(str))}; analyzed rows={len(sample)}; consult file section for exact total.\\\\\")\\\\n target = getattr(config, \\\\\"target\\\\\", None) if config else None\\\\n if train is not None and test is not None:\\\\n train_only, test_only = sorted(set(train)-set(test)), sorted(set(test)-set(train))\\\\n lines += [f\\\\\"Train-only columns / target candidates: {train_only}\\\\\", f\\\\\"Test-only columns: {test_only}\\\\\"]\\\\n if target is None and len(train_only) == 1 and sample is not None and train_only[0] in sample:\\\\n target = train_only[0]\\\\n lines.append(f\\\\\"Strong target candidate: {target}; sole train-only column also appears in sample submission. This does not configure training.\\\\\")\\\\n common = [c for c in train if c in test and c != target]\\\\n feature_columns = [c for c in common if c not in set(id_candidates(train) + id_candidates(test))]\\\\n if feature_columns:\\\\n overlap = train[feature_columns].drop_duplicates().merge(test[feature_columns].drop_duplicates(), on=feature_columns, how=\\\\\"inner\\\\\")\\\\n lines.append(f\\\\\"Distinct matching train/test feature vectors in analyzed rows, excluding candidate IDs and target: {len(overlap)}. No labels transferred.\\\\\")\\\\n if len(overlap):\\\\n risks.append((\\\\\"HIGH\\\\\", f\\\\\"{len(overlap)} train/test feature vectors overlap in analyzed data; investigate legitimate duplicate structure only\\\\\"))\\\\n for c in common:\\\\n a, b = train[c], test[c]\\\\n lines.append(f\\\\\"- {c}: missingness train={a.isna().mean():.3%}, test={b.isna().mean():.3%}.\\\\\")\\\\n if pd.api.types.is_numeric_dtype(a) and pd.api.types.is_numeric_dtype(b):\\\\n lines.append(f\\\\\" Numeric drift diagnostic: train quantiles={a.quantile([.05,.5,.95]).to_dict()}; test quantiles={b.quantile([.05,.5,.95]).to_dict()}.\\\\\")\\\\n else:\\\\n fa, fb = a.astype(\\\\\"string\\\\\").value_counts(normalize=True), b.astype(\\\\\"string\\\\\").value_counts(normalize=True)\\\\n keys = fa.index.union(fb.index)\\\\n distance = float((fa.reindex(keys, fill_value=0)-fb.reindex(keys, fill_value=0)).abs().sum()/2)\\\\n only_a, only_b = fa.index.difference(fb.index), fb.index.difference(fa.index)\\\\n lines.append(f\\\\\" Category drift diagnostic: total variation={distance:.4f}; train-only={len(only_a)} {brief(list(only_a[:10]))}; test-only={len(only_b)} {brief(list(only_b[:10]))}.\\\\\")\\\\n if target and train is not None and target in train:\\\\n y = train[target]\\\\n lines += [\\\\\"\\\\\", f\\\\\"### Target analysis: {target}\\\\\", f\\\\\"Classes/unique values: {y.nunique()}; missing labels: {y.isna().sum()}.\\\\\"]\\\\n likely_class = not pd.api.types.is_numeric_dtype(y) or y.nunique() <= 20\\\\n lines.append(\\\\\"Likely classification; numeric codes may still represent regression. Confirm from the problem statement.\\\\\" if likely_class else \\\\\"Likely regression or high-cardinality labels; confirm from the problem statement.\\\\\")\\\\n lines.append(f\\\\\"Summary: {y.describe().to_dict()}; distribution/common labels: {brief(y.value_counts().head(20).to_dict())}; rare labels (<=2): {int((y.value_counts()<=2).sum())}.\\\\\")\\\\n feature_columns = [c for c in train if c != target and c not in id_candidates(train)]\\\\n if feature_columns:\\\\n duplicates = int(train.duplicated(subset=feature_columns).sum())\\\\n conflicts = int((train.groupby(feature_columns, dropna=False, observed=True)[target].nunique() > 1).sum())\\\\n lines.append(f\\\\\"Duplicate feature rows excluding target/candidate IDs: {duplicates}; feature groups with conflicting labels: {conflicts}.\\\\\")\\\\n if duplicates:\\\\n risks.append((\\\\\"HIGH\\\\\", f\\\\\"{duplicates} duplicate training feature rows; random folds may share records\\\\\"))\\\\n if conflicts:\\\\n risks.append((\\\\\"HIGH\\\\\", f\\\\\"{conflicts} duplicate feature groups have conflicting labels; investigate noise or missing structure\\\\\"))\\\\n for c in feature_columns:\\\\n if train[c].equals(y):\\\\n risks.append((\\\\\"CRITICAL\\\\\", f\\\\\"{c} exactly equals target in analyzed training rows; possible direct target copy\\\\\"))\\\\n elif pd.api.types.is_numeric_dtype(train[c]) and pd.api.types.is_numeric_dtype(y):\\\\n corr = train[c].corr(y)\\\\n if pd.notna(corr) and abs(corr) > .995:\\\\n risks.append((\\\\\"HIGH\\\\\", f\\\\\"{c}: absolute target correlation {abs(corr):.6f}; investigate post-outcome or encoded-target information\\\\\"))\\\\n else:\\\\n lines.append(\\\\\"Target uncertain or unavailable. Target-dependent diagnostics were not performed.\\\\\")\\\\n lines += [\\\\\"\\\\\", \\\\\"## POTENTIAL LEAKAGE RISKS\\\\\", \\\\\"Heuristics and drift signals are diagnostics, not proof. Review before using or removing features.\\\\\"]\\\\n for level in (\\\\\"CRITICAL\\\\\", \\\\\"HIGH\\\\\", \\\\\"MEDIUM\\\\\", \\\\\"LOW\\\\\"):\\\\n lines.append(f\\\\\"### {level}\\\\\")\\\\n findings = list(dict.fromkeys(reason for severity, reason in risks if severity == level))\\\\n lines.extend(f\\\\\"- {finding}\\\\\" for finding in findings)\\\\n if not findings:\\\\n lines.append(\\\\\"- No signal found by these checks; this does not establish absence of leakage.\\\\\")\\\\n lines += [\\\\\"\\\\\", \\\\\"Still requires human review: collection process, post-outcome features, time/groups/entities, duplicate policies, and fold-local preprocessing.\\\\\"]\\\\n report = \\\\\"\\\\\\\\n\\\\\".join(lines) + \\\\\"\\\\\\\\n\\\\\"\\\\n destination = root / \\\\\"reports/data_audit.md\\\\\"\\\\n destination.parent.mkdir(parents=True, exist_ok=True)\\\\n if destination.exists():\\\\n stamp = datetime.now(timezone.utc).strftime(\\\\\"%Y%m%dT%H%M%S%fZ\\\\\")\\\\n destination.rename(destination.with_name(f\\\\\"data_audit_{stamp}.md\\\\\"))\\\\n destination.write_text(report, encoding=\\\\\"utf-8\\\\\")\\\\n print(report)\\\\n return report\\\\n\\\\n\\\\ndef main():\\\\n parser = argparse.ArgumentParser(description=__doc__)\\\\n parser.add_argument(\\\\\"--root\\\\\", type=Path, default=ROOT)\\\\n parser.add_argument(\\\\\"--config\\\\\", type=Path)\\\\n parser.add_argument(\\\\\"--train\\\\\", dest=\\\\\"train_file\\\\\")\\\\n parser.add_argument(\\\\\"--test\\\\\", dest=\\\\\"test_file\\\\\")\\\\n parser.add_argument(\\\\\"--sample\\\\\", dest=\\\\\"sample_file\\\\\")\\\\n parser.add_argument(\\\\\"--target\\\\\")\\\\n parser.add_argument(\\\\\"--full\\\\\", action=\\\\\"store_true\\\\\")\\\\n parser.add_argument(\\\\\"--max-rows\\\\\", type=int, default=100000)\\\\n parser.add_argument(\\\\\"--seed\\\\\", type=int, default=42)\\\\n args = parser.parse_args()\\\\n config = load_config(args.config)\\\\n for key in (\\\\\"train_file\\\\\", \\\\\"test_file\\\\\", \\\\\"sample_file\\\\\", \\\\\"target\\\\\"):\\\\n if getattr(args, key):\\\\n setattr(config, key, getattr(args, key))\\\\n audit(args.root, config=config, full=args.full, max_rows=args.max_rows, seed=args.seed)\\\\n\\\\n\\\\nif __name__ == \\\\\"__main__\\\\\":\\\\n main()\\\\n\",\\n \"config.py\": \"\\\\\"\\\\\"\\\\\"Edit DEFAULT_CONFIG after launch, or supply an equivalent JSON with --config.\\\\\"\\\\\"\\\\\"\\\\nfrom dataclasses import asdict, dataclass, field\\\\nimport json\\\\nfrom pathlib import Path\\\\n\\\\nROOT = Path(__file__).resolve().parents[1]\\\\n\\\\n\\\\n@dataclass\\\\nclass Config:\\\\n train_file: str | None = None\\\\n test_file: str | None = None\\\\n sample_file: str | None = None\\\\n target: str | None = None\\\\n id_columns: list[str] = field(default_factory=list)\\\\n features: list[str] | None = None\\\\n task: str | None = None # regression | classification\\\\n metric: str | None = None\\\\n metric_direction: str | None = None # higher | lower; check Evaluation\\\\n metric_params: dict = field(default_factory=dict)\\\\n custom_metric: str | None = None # src.my_metric:score\\\\n custom_metric_kind: str | None = None\\\\n prediction_kind: str | None = None # value | probability | label | decision\\\\n class_order: list = field(default_factory=list)\\\\n validation_type: str | None = None\\\\n validation_rationale: str | None = None\\\\n n_splits: int | None = None\\\\n shuffle: bool = False\\\\n seed: int = 42\\\\n group_column: str | None = None\\\\n time_column: str | None = None\\\\n time_gap: int = 0\\\\n splits_file: str | None = None\\\\n model: str | None = None\\\\n model_params: dict = field(default_factory=dict)\\\\n text_column: str | None = None\\\\n predict_test: bool = False\\\\n aggregation: str | None = None # mean, explicitly requested for fold inference\\\\n submission_columns: list[str] = field(default_factory=list)\\\\n submission_kind: str | None = None # value | label | probability\\\\n submission_alignment: str | None = None # id | position\\\\n positive_class: str | int | float | None = None\\\\n label_threshold: float | None = None\\\\n smoke_test: bool = False\\\\n\\\\n def to_dict(self):\\\\n return asdict(self)\\\\n\\\\n def path(self, root, value):\\\\n if not value:\\\\n raise ValueError(\\\\\"A required file path is not configured.\\\\\")\\\\n path = Path(value)\\\\n return path if path.is_absolute() else Path(root) / path\\\\n\\\\n def validate(self):\\\\n required = [\\\\\"train_file\\\\\", \\\\\"target\\\\\", \\\\\"features\\\\\", \\\\\"task\\\\\", \\\\\"metric\\\\\",\\\\n \\\\\"metric_direction\\\\\", \\\\\"prediction_kind\\\\\", \\\\\"validation_type\\\\\",\\\\n \\\\\"validation_rationale\\\\\", \\\\\"n_splits\\\\\", \\\\\"model\\\\\"]\\\\n missing = [key for key in required if not getattr(self, key)]\\\\n if missing:\\\\n raise ValueError(\\\\\"Configure after launch before training: \\\\\" + \\\\\", \\\\\".join(missing))\\\\n if self.task not in {\\\\\"regression\\\\\", \\\\\"classification\\\\\"}:\\\\n raise ValueError(\\\\\"task must be regression or classification\\\\\")\\\\n if self.metric_direction not in {\\\\\"higher\\\\\", \\\\\"lower\\\\\"}:\\\\n raise ValueError(\\\\\"metric_direction must be higher or lower\\\\\")\\\\n if self.n_splits < 2:\\\\n raise ValueError(\\\\\"n_splits must be at least 2\\\\\")\\\\n if len(set(self.features)) != len(self.features) or self.target in self.features:\\\\n raise ValueError(\\\\\"Features must be unique and cannot include the target\\\\\")\\\\n if len(set(self.id_columns)) != len(self.id_columns) or any(c in {\\\\\"__row__\\\\\", \\\\\"__fold__\\\\\"} or c.startswith(\\\\\"pred_\\\\\") for c in self.id_columns):\\\\n raise ValueError(\\\\\"ID columns must be unique and cannot use reserved artifact column names\\\\\")\\\\n if set(self.id_columns) & set(self.features):\\\\n raise ValueError(\\\\\"ID columns cannot be features; review suspicious IDs explicitly first\\\\\")\\\\n if self.task == \\\\\"classification\\\\\":\\\\n if len(self.class_order) < 2 or len(set(self.class_order)) != len(self.class_order):\\\\n raise ValueError(\\\\\"Explicit, unique class_order with at least two classes is required\\\\\")\\\\n if self.prediction_kind not in {\\\\\"probability\\\\\", \\\\\"label\\\\\", \\\\\"decision\\\\\"}:\\\\n raise ValueError(\\\\\"Classification requires probability, label, or decision predictions\\\\\")\\\\n elif self.prediction_kind != \\\\\"value\\\\\":\\\\n raise ValueError(\\\\\"Regression requires value predictions\\\\\")\\\\n if self.predict_test and (not self.test_file or self.aggregation != \\\\\"mean\\\\\"):\\\\n raise ValueError(\\\\\"Test inference requires test_file and explicit aggregation=\\'mean\\'\\\\\")\\\\n if self.predict_test and self.prediction_kind == \\\\\"label\\\\\":\\\\n raise ValueError(\\\\\"Fold inference requires numeric values, probabilities, or decision scores; use probabilities for classification labels\\\\\")\\\\n\\\\n\\\\nDEFAULT_CONFIG = Config()\\\\n\\\\n\\\\ndef load_config(path=None):\\\\n if path is None:\\\\n return Config(**DEFAULT_CONFIG.to_dict())\\\\n with Path(path).open(encoding=\\\\\"utf-8-sig\\\\\") as handle:\\\\n return Config(**json.load(handle))\\\\n\\\\n\\\\nif __name__ == \\\\\"__main__\\\\\":\\\\n print(json.dumps(DEFAULT_CONFIG.to_dict(), indent=2))\\\\n\",\\n \"data.py\": \"\\\\\"\\\\\"\\\\\"Readers never discover or load test data as a side effect of training.\\\\\"\\\\\"\\\\\"\\\\nfrom pathlib import Path\\\\nimport pandas as pd\\\\nfrom .utils import sha256\\\\n\\\\nTABLE_SUFFIXES = {\\\\\".csv\\\\\", \\\\\".tsv\\\\\", \\\\\".json\\\\\", \\\\\".jsonl\\\\\", \\\\\".parquet\\\\\", \\\\\".pq\\\\\", \\\\\".xlsx\\\\\", \\\\\".xls\\\\\"}\\\\n\\\\n\\\\ndef read_table(path, *, limit=None, id_columns=()):\\\\n path = Path(path)\\\\n suffix = path.suffix.lower()\\\\n try:\\\\n if suffix in {\\\\\".csv\\\\\", \\\\\".tsv\\\\\"}:\\\\n return pd.read_csv(path, sep=\\\\\"\\\\\\\\t\\\\\" if suffix == \\\\\".tsv\\\\\" else \\\\\",\\\\\", nrows=limit,\\\\n dtype={column: \\\\\"string\\\\\" for column in id_columns})\\\\n if suffix == \\\\\".jsonl\\\\\":\\\\n frame = pd.read_json(path, lines=True, nrows=limit)\\\\n elif suffix == \\\\\".json\\\\\":\\\\n frame = pd.read_json(path)\\\\n elif suffix in {\\\\\".parquet\\\\\", \\\\\".pq\\\\\"}:\\\\n frame = pd.read_parquet(path)\\\\n elif suffix in {\\\\\".xlsx\\\\\", \\\\\".xls\\\\\"}:\\\\n frame = pd.read_excel(path)\\\\n else:\\\\n raise ValueError(f\\\\\"Unsupported table format: {suffix}\\\\\")\\\\n except ImportError as exc:\\\\n package = \\\\\"pyarrow\\\\\" if suffix in {\\\\\".parquet\\\\\", \\\\\".pq\\\\\"} else \\\\\"openpyxl\\\\\" if suffix == \\\\\".xlsx\\\\\" else \\\\\"xlrd\\\\\"\\\\n raise ImportError(f\\\\\"Reading {suffix} needs an optional reader: pip install {package}\\\\\") from exc\\\\n for column in id_columns:\\\\n if column in frame:\\\\n frame[column] = frame[column].astype(\\\\\"string\\\\\")\\\\n return frame if limit is None else frame.head(limit)\\\\n\\\\n\\\\ndef require_columns(frame, columns, context):\\\\n missing = sorted(set(columns) - set(frame.columns))\\\\n if missing:\\\\n raise ValueError(f\\\\\"{context}: missing columns {missing}\\\\\")\\\\n\\\\n\\\\ndef load_training(config, root):\\\\n path = config.path(root, config.train_file)\\\\n frame = read_table(path, id_columns=config.id_columns)\\\\n require_columns(frame, [config.target, *config.features, *config.id_columns], \\\\\"Training data\\\\\")\\\\n if frame.empty or frame[config.target].isna().any():\\\\n raise ValueError(\\\\\"Training data must be nonempty with no missing targets\\\\\")\\\\n return frame, {\\\\\"sha256\\\\\": sha256(path), \\\\\"rows\\\\\": len(frame), \\\\\"columns\\\\\": list(frame.columns)}\\\\n\\\\n\\\\ndef load_test(config, root):\\\\n path = config.path(root, config.test_file)\\\\n frame = read_table(path, id_columns=config.id_columns)\\\\n require_columns(frame, [*config.features, *config.id_columns], \\\\\"Inference data\\\\\")\\\\n if config.target in frame.columns:\\\\n raise ValueError(\\\\\"Test file contains the configured target; investigate before inference\\\\\")\\\\n return frame, {\\\\\"sha256\\\\\": sha256(path), \\\\\"rows\\\\\": len(frame), \\\\\"columns\\\\\": list(frame.columns)}\\\\n\",\\n \"ensemble.py\": \"\\\\\"\\\\\"\\\\\"Explicit arithmetic/weighted blends evaluated on compatible OOF predictions.\\\\\"\\\\\"\\\\\"\\\\nif __package__ in {None, \\\\\"\\\\\"}:\\\\n import sys\\\\n from pathlib import Path\\\\n sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\\\\n __package__ = \\\\\"src\\\\\"\\\\n\\\\nimport argparse\\\\nfrom pathlib import Path\\\\nimport time\\\\nimport numpy as np\\\\nfrom .config import Config, ROOT\\\\nfrom .data import load_training\\\\nfrom .metrics import score\\\\nfrom .predict import read_predictions, save_predictions\\\\nfrom .utils import checked_record, environment, finish_record, read_json, reserve_experiment, save_json, snapshot_source\\\\n\\\\nCOMPATIBLE_FIELDS = (\\\\\"target\\\\\", \\\\\"task\\\\\", \\\\\"metric\\\\\", \\\\\"metric_direction\\\\\", \\\\\"metric_params\\\\\", \\\\\"custom_metric\\\\\", \\\\\"custom_metric_kind\\\\\",\\\\n \\\\\"prediction_kind\\\\\", \\\\\"class_order\\\\\", \\\\\"positive_class\\\\\", \\\\\"label_threshold\\\\\", \\\\\"id_columns\\\\\")\\\\n\\\\n\\\\ndef compatible_artifacts(items):\\\\n base_frame, base_values, base = items[0]\\\\n for frame, values, metadata in items[1:]:\\\\n for key in (\\\\\"identity_hash\\\\\", \\\\\"data_fingerprint\\\\\", \\\\\"class_order\\\\\", \\\\\"prediction_kind\\\\\", \\\\\"prediction_columns\\\\\", \\\\\"split_signature\\\\\", \\\\\"id_columns\\\\\"):\\\\n if metadata[key] != base[key]:\\\\n raise ValueError(f\\\\\"Incompatible ensemble artifacts: {key}\\\\\")\\\\n if values.shape != base_values.shape:\\\\n raise ValueError(\\\\\"Incompatible prediction shapes\\\\\")\\\\n if \\\\\"__fold__\\\\\" in base_frame and not np.array_equal(base_frame[\\\\\"__fold__\\\\\"], frame[\\\\\"__fold__\\\\\"]):\\\\n raise ValueError(\\\\\"Incompatible OOF coverage/fold assignment\\\\\")\\\\n return base_frame, base\\\\n\\\\n\\\\ndef blend_experiments(root, experiment, members, weights, hypothesis, change, *, method=\\\\\"weighted\\\\\", predict_test=False, train_file=None):\\\\n root = Path(root)\\\\n weights = np.asarray(weights, dtype=float)\\\\n if len(members) < 2 or len(set(members)) != len(members) or len(weights) != len(members):\\\\n raise ValueError(\\\\\"Provide at least two distinct member IDs and one weight per member\\\\\")\\\\n if not np.isfinite(weights).all() or (weights < 0).any() or not np.isclose(weights.sum(), 1, atol=1e-8, rtol=0):\\\\n raise ValueError(\\\\\"Weights must be finite, nonnegative, and sum to one; they are never automatically normalized\\\\\")\\\\n if method not in {\\\\\"mean\\\\\", \\\\\"weighted\\\\\"} or (method == \\\\\"mean\\\\\" and not np.allclose(weights, 1/len(members), rtol=0, atol=1e-8)):\\\\n raise ValueError(\\\\\"Arithmetic mean requires explicit equal weights; method must be mean or weighted\\\\\")\\\\n records = [checked_record(root, member) for member in members]\\\\n config = Config(**records[0][\\\\\"config\\\\\"])\\\\n if config.prediction_kind == \\\\\"label\\\\\":\\\\n raise ValueError(\\\\\"Do not average class labels; use compatible probabilities\\\\\")\\\\n for record in records[1:]:\\\\n if any(record[\\\\\"config\\\\\"][key] != config.to_dict()[key] for key in COMPATIBLE_FIELDS):\\\\n raise ValueError(\\\\\"Ensemble task/metric/class/decision configuration mismatch\\\\\")\\\\n if record[\\\\\"split_signature\\\\\"] != records[0][\\\\\"split_signature\\\\\"]:\\\\n raise ValueError(\\\\\"Ensemble members must use identical saved splits\\\\\")\\\\n oofs = [read_predictions(root / record[\\\\\"oof_path\\\\\"]) for record in records]\\\\n oof_frame, oof_meta = compatible_artifacts(oofs)\\\\n test_items = []\\\\n if predict_test:\\\\n if any(not r.get(\\\\\"prediction_path\\\\\") for r in records):\\\\n raise ValueError(\\\\\"All members need explicit test inference before blending predictions\\\\\")\\\\n test_items = [read_predictions(root / r[\\\\\"prediction_path\\\\\"]) for r in records]\\\\n compatible_artifacts(test_items)\\\\n if train_file:\\\\n config.train_file = train_file\\\\n frame, fingerprint = load_training(config, root)\\\\n if fingerprint != oof_meta[\\\\\"data_fingerprint\\\\\"]:\\\\n raise ValueError(\\\\\"Training labels no longer match saved OOF data\\\\\")\\\\n config.model = \\\\\"ensemble\\\\\"\\\\n config.model_params = {\\\\\"members\\\\\": members, \\\\\"weights\\\\\": weights.tolist(), \\\\\"method\\\\\": method}\\\\n config.predict_test = predict_test\\\\n config.aggregation = \\\\\"mean\\\\\" if predict_test else None\\\\n record = reserve_experiment(root, experiment, config, hypothesis, change)\\\\n start = time.perf_counter()\\\\n try:\\\\n provenance = root / record[\\\\\"provenance_path\\\\\"]\\\\n record[\\\\\"source_hashes\\\\\"] = snapshot_source(provenance / \\\\\"source\\\\\")\\\\n save_json(provenance / \\\\\"config.json\\\\\", config.to_dict(), exclusive=True)\\\\n save_json(provenance / \\\\\"environment.json\\\\\", environment(), exclusive=True)\\\\n split_payload = read_json(root / records[0][\\\\\"splits_path\\\\\"])\\\\n save_json(provenance / \\\\\"splits.json\\\\\", split_payload, exclusive=True)\\\\n blended = sum(weight * item[1] for weight, item in zip(weights, oofs))\\\\n assignment = oof_frame[\\\\\"__fold__\\\\\"].to_numpy()\\\\n fold_scores = [score(frame.loc[assignment == fold, config.target], blended[assignment == fold], config) for fold in range(config.n_splits)]\\\\n oof_path = f\\\\\"outputs/oof/{experiment}.csv\\\\\"\\\\n save_predictions(root / oof_path, frame, blended, config, fingerprint, folds=assignment, split_signature=oof_meta[\\\\\"split_signature\\\\\"])\\\\n record.update(ensemble=config.model_params, train_fingerprint=fingerprint, split_signature=oof_meta[\\\\\"split_signature\\\\\"],\\\\n splits_path=f\\\\\"{record[\\'provenance_path\\']}splits.json\\\\\", oof_path=oof_path,\\\\n fold_scores=fold_scores, cv_mean=float(np.mean(fold_scores)), cv_std=float(np.std(fold_scores)),\\\\n cv_std_definition=\\\\\"population std (ddof=0)\\\\\", oof_coverage=float(np.mean(assignment >= 0)))\\\\n if test_items:\\\\n test_frame, test_meta = compatible_artifacts(test_items)\\\\n predictions = sum(weight * item[1] for weight, item in zip(weights, test_items))\\\\n path = f\\\\\"outputs/predictions/{experiment}.csv\\\\\"\\\\n save_predictions(root / path, test_frame, predictions, config, test_meta[\\\\\"data_fingerprint\\\\\"])\\\\n record.update(prediction_path=path, test_fingerprint=test_meta[\\\\\"data_fingerprint\\\\\"])\\\\n record.update(status=\\\\\"completed\\\\\", training_seconds=time.perf_counter()-start)\\\\n finish_record(root, record)\\\\n print(f\\\\\"{experiment}: CV {record[\\'cv_mean\\']:.8g} +/- {record[\\'cv_std\\']:.8g}\\\\\")\\\\n return record\\\\n except BaseException as exc:\\\\n record.update(status=\\\\\"failed\\\\\", error=f\\\\\"{type(exc).__name__}: {exc}\\\\\")\\\\n finish_record(root, record)\\\\n raise\\\\n\\\\n\\\\ndef main():\\\\n parser = argparse.ArgumentParser(description=__doc__)\\\\n parser.add_argument(\\\\\"--root\\\\\", type=Path, default=ROOT)\\\\n parser.add_argument(\\\\\"--experiment\\\\\", required=True)\\\\n parser.add_argument(\\\\\"--members\\\\\", nargs=\\\\\"+\\\\\", required=True)\\\\n parser.add_argument(\\\\\"--weights\\\\\", nargs=\\\\\"+\\\\\", type=float, required=True)\\\\n parser.add_argument(\\\\\"--method\\\\\", choices=[\\\\\"mean\\\\\", \\\\\"weighted\\\\\"], default=\\\\\"weighted\\\\\")\\\\n parser.add_argument(\\\\\"--hypothesis\\\\\", required=True)\\\\n parser.add_argument(\\\\\"--change\\\\\", required=True)\\\\n parser.add_argument(\\\\\"--predict-test\\\\\", action=\\\\\"store_true\\\\\")\\\\n args = parser.parse_args()\\\\n try:\\\\n blend_experiments(args.root, args.experiment, args.members, args.weights, args.hypothesis, args.change,\\\\n method=args.method, predict_test=args.predict_test)\\\\n except (ValueError, OSError, ImportError) as exc:\\\\n parser.exit(2, f\\\\\"Ensemble stopped: {exc}\\\\\\\\n\\\\\")\\\\n\\\\n\\\\nif __name__ == \\\\\"__main__\\\\\":\\\\n main()\\\\n\",\\n \"export_notebook.py\": \"\\\\\"\\\\\"\\\\\"Freeze saved experiment source into a standalone notebook; never upload it.\\\\\"\\\\\"\\\\\"\\\\nif __package__ in {None, \\\\\"\\\\\"}:\\\\n import sys\\\\n from pathlib import Path\\\\n sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\\\\n __package__ = \\\\\"src\\\\\"\\\\n\\\\nimport argparse\\\\nfrom datetime import datetime, timezone\\\\nfrom pathlib import Path\\\\nfrom .config import ROOT\\\\nfrom .utils import checked_record, dumps, read_json, save_json, sha256\\\\n\\\\n\\\\ndef markdown(text):\\\\n return {\\\\\"cell_type\\\\\": \\\\\"markdown\\\\\", \\\\\"metadata\\\\\": {}, \\\\\"source\\\\\": text.splitlines(keepends=True)}\\\\n\\\\n\\\\ndef code(text):\\\\n return {\\\\\"cell_type\\\\\": \\\\\"code\\\\\", \\\\\"metadata\\\\\": {}, \\\\\"source\\\\\": text.splitlines(keepends=True), \\\\\"execution_count\\\\\": None, \\\\\"outputs\\\\\": []}\\\\n\\\\n\\\\ndef notebook(cells):\\\\n for index, cell in enumerate(cells):\\\\n cell[\\\\\"id\\\\\"] = f\\\\\"cell-{index:03d}\\\\\"\\\\n return {\\\\\"nbformat\\\\\": 4, \\\\\"nbformat_minor\\\\\": 5,\\\\n \\\\\"metadata\\\\\": {\\\\\"kernelspec\\\\\": {\\\\\"display_name\\\\\": \\\\\"Python 3\\\\\", \\\\\"language\\\\\": \\\\\"python\\\\\", \\\\\"name\\\\\": \\\\\"python3\\\\\"},\\\\n \\\\\"language_info\\\\\": {\\\\\"name\\\\\": \\\\\"python\\\\\"}}, \\\\\"cells\\\\\": cells}\\\\n\\\\n\\\\nREPLAY = \\'\\'\\'import json\\\\nimport os\\\\nimport subprocess\\\\nimport sys\\\\nfrom pathlib import Path\\\\n\\\\nfor original, replacement in INPUT_FILES.items():\\\\n if not replacement or not Path(replacement).is_file():\\\\n raise ValueError(f\\\\\"Map organizer input {original!r} to an existing file before replay\\\\\")\\\\nRUN_ROOT.mkdir(parents=True, exist_ok=False)\\\\n\\\\nfor item in BUNDLE[\\\\\"experiments\\\\\"]:\\\\n record = item[\\\\\"record\\\\\"]\\\\n experiment = record[\\\\\"experiment_id\\\\\"]\\\\n execution = RUN_ROOT / \\\\\"execution_sources\\\\\" / experiment\\\\n source = execution / \\\\\"src\\\\\"\\\\n source.mkdir(parents=True)\\\\n for name, content in item[\\\\\"source\\\\\"].items():\\\\n (source / name).write_text(content, encoding=\\\\\"utf-8\\\\\", newline=\\\\\"\\\\\")\\\\n settings = dict(record[\\\\\"config\\\\\"])\\\\n for key in (\\\\\"train_file\\\\\", \\\\\"test_file\\\\\", \\\\\"sample_file\\\\\"):\\\\n if settings.get(key) in INPUT_FILES:\\\\n settings[key] = str(INPUT_FILES[settings[key]])\\\\n settings[\\\\\"predict_test\\\\\"] = False\\\\n saved_splits = execution / \\\\\"splits.json\\\\\"\\\\n saved_splits.write_text(json.dumps(item[\\\\\"splits\\\\\"]), encoding=\\\\\"utf-8\\\\\")\\\\n settings[\\\\\"splits_file\\\\\"] = str(saved_splits)\\\\n cfg_path = execution / \\\\\"replay_config.json\\\\\"\\\\n cfg_path.write_text(json.dumps(settings), encoding=\\\\\"utf-8\\\\\")\\\\n item_path = execution / \\\\\"expected.json\\\\\"\\\\n item_path.write_text(json.dumps(item), encoding=\\\\\"utf-8\\\\\")\\\\n runner = r\\\\\\\\\\'\\\\\\\\\\'\\\\\\\\\\'import json, sys\\\\nfrom pathlib import Path\\\\nfrom src.config import load_config\\\\nfrom src.train import train_experiment\\\\nfrom src.predict import predict_experiment\\\\nfrom src.ensemble import blend_experiments\\\\nfrom src.submission import generate_submission\\\\nfrom src.utils import sha256, read_json\\\\nroot, cfg_path, item_path, inputs_path = map(Path, sys.argv[1:])\\\\ncfg = load_config(cfg_path)\\\\nitem = read_json(item_path)\\\\nexpected = item[\\\\\"record\\\\\"]\\\\ninputs = read_json(inputs_path)\\\\neid = expected[\\\\\"experiment_id\\\\\"]\\\\nif expected.get(\\\\\"ensemble\\\\\"):\\\\n recipe = expected[\\\\\"ensemble\\\\\"]\\\\n result = blend_experiments(root, eid, recipe[\\\\\"members\\\\\"], recipe[\\\\\"weights\\\\\"], expected[\\\\\"hypothesis\\\\\"], expected[\\\\\"change_description\\\\\"], method=recipe[\\\\\"method\\\\\"], predict_test=bool(expected.get(\\\\\"prediction_path\\\\\")), train_file=cfg.train_file)\\\\nelse:\\\\n result = train_experiment(cfg, eid, expected[\\\\\"hypothesis\\\\\"], expected[\\\\\"change_description\\\\\"], root=root, parent=expected.get(\\\\\"parent_experiment\\\\\"))\\\\n if expected.get(\\\\\"prediction_path\\\\\"):\\\\n original_test = expected.get(\\\\\"inference\\\\\", {}).get(\\\\\"test_file\\\\\") or expected[\\\\\"config\\\\\"][\\\\\"test_file\\\\\"]\\\\n result = predict_experiment(root, eid, test_file=inputs[original_test], aggregation=\\\\\"mean\\\\\")\\\\nfor key, expected_hash in item[\\\\\"artifact_hashes\\\\\"].items():\\\\n actual = sha256(root / result[key])\\\\n if actual != expected_hash:\\\\n raise RuntimeError(f\\\\\"{eid} {key} does not reproduce byte-for-byte. Investigate environment, nondeterminism, or source changes; do not claim reproduction.\\\\\")\\\\nfor entry in expected.get(\\\\\"submissions\\\\\", []):\\\\n for key, value in entry[\\\\\"config\\\\\"].items():\\\\n setattr(cfg, key, inputs.get(value, value) if key == \\\\\"sample_file\\\\\" else value)\\\\n # Preserve the recorded descriptive filename by recovering its description.\\\\n filename = Path(entry[\\\\\"submission_path\\\\\"]).name\\\\n prefix = f\\\\\"sub_{eid}_{expected[\\'model\\']}_\\\\\"\\\\n description = filename[len(prefix):].rsplit(\\\\\"_cv\\\\\", 1)[0]\\\\n output = generate_submission(root, eid, config=cfg, description=description)\\\\n if sha256(output) != entry[\\\\\"sha256\\\\\"]:\\\\n raise RuntimeError(f\\\\\"Submission did not reproduce exactly: {filename}\\\\\")\\\\nprint(f\\\\\"VERIFIED: {eid}, saved source + saved splits + exact artifact hashes\\\\\")\\\\n\\\\\\\\\\'\\\\\\\\\\'\\\\\\\\\\'\\\\n runner_path = execution / \\\\\"run_replay.py\\\\\"\\\\n runner_path.write_text(runner, encoding=\\\\\"utf-8\\\\\")\\\\n input_map_path = execution / \\\\\"inputs.json\\\\\"\\\\n input_map_path.write_text(json.dumps({k: str(v) for k, v in INPUT_FILES.items()}), encoding=\\\\\"utf-8\\\\\")\\\\n process = subprocess.run([sys.executable, str(runner_path), str(RUN_ROOT), str(cfg_path), str(item_path), str(input_map_path)], cwd=execution, text=True, capture_output=True)\\\\n print(process.stdout)\\\\n if process.returncode:\\\\n print(process.stderr)\\\\n raise RuntimeError(f\\\\\"Replay failed for {experiment}; fix the reported cause before claiming reproducibility\\\\\")\\\\nprint(\\\\\"All bundled experiments verified. Submission generation did not upload anything.\\\\\")\\\\n\\'\\'\\'\\\\n\\\\n\\\\ndef export_notebook(root, experiment, *, output=None):\\\\n root = Path(root)\\\\n ordered, seen, visiting = [], set(), set()\\\\n def visit(eid):\\\\n if eid in seen:\\\\n return\\\\n if eid in visiting:\\\\n raise ValueError(\\\\\"Ensemble provenance contains a cycle\\\\\")\\\\n visiting.add(eid)\\\\n record = checked_record(root, eid)\\\\n for member in record.get(\\\\\"ensemble\\\\\", {}).get(\\\\\"members\\\\\", []):\\\\n visit(member)\\\\n provenance = root / record[\\\\\"provenance_path\\\\\"]\\\\n sources = {}\\\\n for name, expected_hash in record[\\\\\"source_hashes\\\\\"].items():\\\\n if Path(name).name != name or not name.endswith(\\\\\".py\\\\\"):\\\\n raise ValueError(\\\\\"Invalid source snapshot filename\\\\\")\\\\n path = provenance / \\\\\"source\\\\\" / name\\\\n if sha256(path) != expected_hash:\\\\n raise ValueError(f\\\\\"Source snapshot was modified: {eid}/{name}\\\\\")\\\\n sources[name] = path.read_bytes().decode(\\\\\"utf-8\\\\\")\\\\n artifacts = {}\\\\n for key in (\\\\\"oof_path\\\\\", \\\\\"prediction_path\\\\\"):\\\\n if record.get(key):\\\\n path = root / record[key]\\\\n metadata = read_json(path.with_suffix(\\\\\".meta.json\\\\\"))\\\\n if sha256(path) != metadata[\\\\\"sha256\\\\\"]:\\\\n raise ValueError(f\\\\\"Artifact was modified: {path}\\\\\")\\\\n artifacts[key] = metadata[\\\\\"sha256\\\\\"]\\\\n ordered.append({\\\\\"record\\\\\": record, \\\\\"source\\\\\": sources, \\\\\"splits\\\\\": read_json(root / record[\\\\\"splits_path\\\\\"]),\\\\n \\\\\"environment\\\\\": read_json(provenance / \\\\\"environment.json\\\\\"), \\\\\"artifact_hashes\\\\\": artifacts})\\\\n visiting.remove(eid)\\\\n seen.add(eid)\\\\n visit(experiment)\\\\n inputs = {}\\\\n for item in ordered:\\\\n record = item[\\\\\"record\\\\\"]\\\\n inputs[record[\\\\\"config\\\\\"][\\\\\"train_file\\\\\"]] = None\\\\n if record.get(\\\\\"prediction_path\\\\\") and not record.get(\\\\\"ensemble\\\\\"):\\\\n inputs[record.get(\\\\\"inference\\\\\", {}).get(\\\\\"test_file\\\\\") or record[\\\\\"config\\\\\"][\\\\\"test_file\\\\\"]] = None\\\\n for entry in record.get(\\\\\"submissions\\\\\", []):\\\\n inputs[entry[\\\\\"config\\\\\"][\\\\\"sample_file\\\\\"]] = None\\\\n bundle = {\\\\\"candidate\\\\\": experiment, \\\\\"experiments\\\\\": ordered}\\\\n cells = [markdown(f\\\\\"# REACT 2026 \\\\u2014 reproduce {experiment}\\\\\\\\n\\\\\\\\nThis notebook embeds the saved source for each experiment. It loads only mapped organizer files. Run from a fresh kernel and a new output directory. No Kaggle upload is implemented.\\\\\\\\n\\\\\\\\nFor a serious candidate: commit local code, run this notebook, verify every artifact, Save Version, then record and privately share that exact version with the organizers. Do not share with other teams.\\\\\"),\\\\n markdown(\\\\\"## Runtime and disclosures\\\\\\\\n\\\\\\\\nThe frozen bundle records Python, package versions, source hashes, model parameters, seeds, and exact folds. Inspect `BUNDLE[\\'experiments\\'][i][\\'environment\\']` and install the recorded required packages explicitly if needed. Optional model libraries are not installed automatically. Numerical differences cause replay verification to stop.\\\\\\\\n\\\\\\\\nPretrained models: none in the starter. If activated later, record source, exact public model name/revision, and loading code directly in this notebook and the method summary.\\\\\"),\\\\n code(\\\\\"import json\\\\\\\\nfrom pathlib import Path\\\\\\\\nBUNDLE = json.loads(\\\\\" + repr(dumps(bundle)) + \\\\\")\\\\\\\\nprint([(e[\\'record\\'][\\'experiment_id\\'], e[\\'environment\\'][\\'python\\']) for e in BUNDLE[\\'experiments\\']])\\\\\\\\n\\\\\"),\\\\n markdown(\\\\\"## Map competition inputs\\\\\\\\n\\\\\\\\nReplace each `None` with its `/kaggle/input/...` path. These are paths to the same organizer files, not new data. Choose a fresh writable RUN_ROOT for every execution. The original input paths are provenance labels only.\\\\\"),\\\\n code(\\\\\"RUN_ROOT = Path(globals().get(\\'REPLAY_ROOT\\', \\'/kaggle/working/react-replay-\\\\\" + experiment + \\\\\"\\')).resolve()\\\\\\\\nINPUT_FILES = globals().get(\\'REPLAY_INPUTS\\', json.loads(\\\\\" + repr(dumps(inputs)) + \\\\\"))\\\\\\\\n\\\\\"),\\\\n code(REPLAY),\\\\n markdown(\\\\\"## Commit and record the exact version\\\\\\\\n\\\\\\\\nConfirm all VERIFIED messages and generated CSVs under RUN_ROOT/submissions. Save a committed Kaggle Notebook version that runs training and inference. Add its exact version URL to experiments/experiments.csv, the candidate report, and submission sidecar. Upload a CSV only on explicit human instruction. Up to two final selections remain human decisions. Never replace a prior candidate or infer a successful replay from a completed training cell alone.\\\\\")]\\\\n stamp = datetime.now(timezone.utc).strftime(\\\\\"%Y%m%dT%H%M%S%fZ\\\\\")\\\\n destination = Path(output) if output else root / \\\\\"notebooks\\\\\" / f\\\\\"reproduce_{experiment}_{stamp}.ipynb\\\\\"\\\\n save_json(destination, notebook(cells), exclusive=True)\\\\n return destination\\\\n\\\\n\\\\ndef main():\\\\n parser = argparse.ArgumentParser(description=__doc__)\\\\n parser.add_argument(\\\\\"--root\\\\\", type=Path, default=ROOT)\\\\n parser.add_argument(\\\\\"--experiment\\\\\", required=True)\\\\n parser.add_argument(\\\\\"--output\\\\\", type=Path)\\\\n args = parser.parse_args()\\\\n try:\\\\n print(export_notebook(args.root, args.experiment, output=args.output))\\\\n except (ValueError, OSError) as exc:\\\\n parser.exit(2, f\\\\\"Export stopped: {exc}\\\\\\\\n\\\\\")\\\\n\\\\n\\\\nif __name__ == \\\\\"__main__\\\\\":\\\\n main()\\\\n\",\\n \"features.py\": \"\\\\\"\\\\\"\\\\\"Modest baseline pipelines. All learned transforms are fitted inside folds.\\\\\"\\\\\"\\\\\"\\\\nimport importlib\\\\nimport numpy as np\\\\nfrom sklearn.compose import ColumnTransformer, make_column_selector\\\\nfrom sklearn.pipeline import Pipeline\\\\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler, FunctionTransformer\\\\nfrom sklearn.impute import SimpleImputer\\\\nfrom sklearn.feature_extraction.text import TfidfVectorizer\\\\nfrom sklearn.linear_model import LinearRegression, LogisticRegression\\\\nfrom sklearn.svm import LinearSVC\\\\nfrom sklearn.ensemble import RandomForestClassifier, RandomForestRegressor, ExtraTreesClassifier, ExtraTreesRegressor\\\\n\\\\n\\\\ndef clean_categories(frame):\\\\n return frame.astype(object).where(frame.notna(), np.nan).map(lambda x: str(x) if x is not np.nan and x is not None and not (isinstance(x, float) and np.isnan(x)) else np.nan)\\\\n\\\\n\\\\ndef text_values(frame):\\\\n return frame.iloc[:, 0].fillna(\\\\\"\\\\\").astype(str).to_numpy()\\\\n\\\\n\\\\ndef estimator(config):\\\\n classifier = config.task == \\\\\"classification\\\\\"\\\\n params = dict(config.model_params)\\\\n if config.model in {\\\\\"linear\\\\\", \\\\\"logistic\\\\\", \\\\\"tfidf_logistic\\\\\"}:\\\\n if config.model != \\\\\"linear\\\\\" and not classifier:\\\\n raise ValueError(\\\\\"Logistic models require classification\\\\\")\\\\n if classifier:\\\\n return LogisticRegression(**{\\\\\"max_iter\\\\\": 1000, \\\\\"random_state\\\\\": config.seed, **params})\\\\n return LinearRegression(**params)\\\\n if config.model == \\\\\"tfidf_linear\\\\\":\\\\n if not classifier:\\\\n raise ValueError(\\\\\"tfidf_linear is a classification template\\\\\")\\\\n if config.prediction_kind == \\\\\"probability\\\\\":\\\\n raise ValueError(\\\\\"LinearSVC has no predict_proba; choose another model or explicitly design calibration\\\\\")\\\\n return LinearSVC(**{\\\\\"random_state\\\\\": config.seed, **params})\\\\n if config.model in {\\\\\"random_forest\\\\\", \\\\\"extra_trees\\\\\"}:\\\\n cls = (RandomForestClassifier if classifier else RandomForestRegressor) if config.model == \\\\\"random_forest\\\\\" else (ExtraTreesClassifier if classifier else ExtraTreesRegressor)\\\\n return cls(**{\\\\\"n_estimators\\\\\": 100, \\\\\"random_state\\\\\": config.seed, \\\\\"n_jobs\\\\\": 1, **params})\\\\n choices = {\\\\\"catboost\\\\\": (\\\\\"catboost\\\\\", \\\\\"CatBoost\\\\\", {\\\\\"random_seed\\\\\": config.seed, \\\\\"verbose\\\\\": False, \\\\\"allow_writing_files\\\\\": False}),\\\\n \\\\\"lightgbm\\\\\": (\\\\\"lightgbm\\\\\", \\\\\"LGBM\\\\\", {\\\\\"random_state\\\\\": config.seed, \\\\\"verbosity\\\\\": -1, \\\\\"n_jobs\\\\\": 1}),\\\\n \\\\\"xgboost\\\\\": (\\\\\"xgboost\\\\\", \\\\\"XGB\\\\\", {\\\\\"random_state\\\\\": config.seed, \\\\\"n_jobs\\\\\": 1})}\\\\n if config.model not in choices:\\\\n raise ValueError(f\\\\\"Unknown model {config.model!r}\\\\\")\\\\n package, prefix, defaults = choices[config.model]\\\\n try:\\\\n module = importlib.import_module(package)\\\\n except ImportError as exc:\\\\n raise ImportError(f\\\\\"Optional model {config.model} is not installed. Install explicitly: pip install {package}\\\\\") from exc\\\\n cls = getattr(module, prefix + (\\\\\"Classifier\\\\\" if classifier else \\\\\"Regressor\\\\\"))\\\\n return cls(**{**defaults, **params})\\\\n\\\\n\\\\ndef build_pipeline(config):\\\\n model = estimator(config)\\\\n if config.model.startswith(\\\\\"tfidf_\\\\\"):\\\\n if config.features != [config.text_column]:\\\\n raise ValueError(\\\\\"TF-IDF templates require features=[text_column]\\\\\")\\\\n return Pipeline([(\\\\\"text\\\\\", FunctionTransformer(text_values)), (\\\\\"tfidf\\\\\", TfidfVectorizer()), (\\\\\"model\\\\\", model)])\\\\n numeric = Pipeline([(\\\\\"impute\\\\\", SimpleImputer(strategy=\\\\\"median\\\\\", keep_empty_features=True)),\\\\n (\\\\\"scale\\\\\", StandardScaler(with_mean=False))])\\\\n categorical = Pipeline([(\\\\\"clean\\\\\", FunctionTransformer(clean_categories)),\\\\n (\\\\\"impute\\\\\", SimpleImputer(strategy=\\\\\"constant\\\\\", fill_value=\\\\\"__MISSING__\\\\\", keep_empty_features=True)),\\\\n (\\\\\"encode\\\\\", OneHotEncoder(handle_unknown=\\\\\"ignore\\\\\", dtype=np.float64))])\\\\n preprocessing = ColumnTransformer([\\\\n (\\\\\"numeric\\\\\", numeric, make_column_selector(dtype_include=np.number)),\\\\n (\\\\\"categorical\\\\\", categorical, make_column_selector(dtype_exclude=np.number))])\\\\n return Pipeline([(\\\\\"preprocess\\\\\", preprocessing), (\\\\\"model\\\\\", model)])\\\\n\",\\n \"metrics.py\": \"\\\\\"\\\\\"\\\\\"Helpers, not a declaration of the official competition metric.\\\\\"\\\\\"\\\\\"\\\\nfrom dataclasses import dataclass\\\\nimport importlib\\\\nimport numpy as np\\\\nfrom sklearn import metrics as skm\\\\n\\\\n\\\\n@dataclass(frozen=True)\\\\nclass Metric:\\\\n function: object\\\\n direction: str\\\\n kind: str\\\\n\\\\n\\\\nREGISTRY = {\\\\n \\\\\"mae\\\\\": Metric(skm.mean_absolute_error, \\\\\"lower\\\\\", \\\\\"value\\\\\"),\\\\n \\\\\"mse\\\\\": Metric(skm.mean_squared_error, \\\\\"lower\\\\\", \\\\\"value\\\\\"),\\\\n \\\\\"rmse\\\\\": Metric(lambda y, p, **kw: np.sqrt(skm.mean_squared_error(y, p, **kw)), \\\\\"lower\\\\\", \\\\\"value\\\\\"),\\\\n \\\\\"r2\\\\\": Metric(skm.r2_score, \\\\\"higher\\\\\", \\\\\"value\\\\\"),\\\\n \\\\\"accuracy\\\\\": Metric(skm.accuracy_score, \\\\\"higher\\\\\", \\\\\"label\\\\\"),\\\\n \\\\\"f1\\\\\": Metric(skm.f1_score, \\\\\"higher\\\\\", \\\\\"label\\\\\"),\\\\n \\\\\"precision\\\\\": Metric(skm.precision_score, \\\\\"higher\\\\\", \\\\\"label\\\\\"),\\\\n \\\\\"recall\\\\\": Metric(skm.recall_score, \\\\\"higher\\\\\", \\\\\"label\\\\\"),\\\\n \\\\\"log_loss\\\\\": Metric(skm.log_loss, \\\\\"lower\\\\\", \\\\\"probability\\\\\"),\\\\n \\\\\"roc_auc\\\\\": Metric(skm.roc_auc_score, \\\\\"higher\\\\\", \\\\\"score\\\\\"),\\\\n \\\\\"average_precision\\\\\": Metric(skm.average_precision_score, \\\\\"higher\\\\\", \\\\\"score\\\\\"),\\\\n}\\\\n\\\\n\\\\ndef metric_definition(config):\\\\n if config.metric == \\\\\"custom\\\\\":\\\\n if not config.custom_metric or config.custom_metric_kind not in {\\\\\"value\\\\\", \\\\\"label\\\\\", \\\\\"probability\\\\\", \\\\\"decision\\\\\"}:\\\\n raise ValueError(\\\\\"Custom metric requires module:function and custom_metric_kind\\\\\")\\\\n module, name = config.custom_metric.split(\\\\\":\\\\\", 1)\\\\n metric = Metric(getattr(importlib.import_module(module), name), config.metric_direction, config.custom_metric_kind)\\\\n else:\\\\n if config.metric not in REGISTRY:\\\\n raise ValueError(f\\\\\"Unknown metric {config.metric!r}; add the exact official implementation\\\\\")\\\\n metric = REGISTRY[config.metric]\\\\n if metric.direction != config.metric_direction:\\\\n raise ValueError(\\\\\"Metric direction disagrees with the helper; implement a custom metric if Evaluation transforms it\\\\\")\\\\n if config.metric in {\\\\\"f1\\\\\", \\\\\"precision\\\\\", \\\\\"recall\\\\\"}:\\\\n if \\\\\"average\\\\\" not in config.metric_params:\\\\n raise ValueError(\\\\\"Set metric_params.average explicitly\\\\\")\\\\n if config.metric_params[\\\\\"average\\\\\"] == \\\\\"binary\\\\\" and \\\\\"pos_label\\\\\" not in config.metric_params:\\\\n raise ValueError(\\\\\"Binary averaging requires explicit metric_params.pos_label\\\\\")\\\\n compatible = {\\\\\"value\\\\\": {\\\\\"value\\\\\"}, \\\\\"label\\\\\": {\\\\\"label\\\\\", \\\\\"probability\\\\\"},\\\\n \\\\\"probability\\\\\": {\\\\\"probability\\\\\"}, \\\\\"score\\\\\": {\\\\\"probability\\\\\", \\\\\"decision\\\\\"},\\\\n \\\\\"decision\\\\\": {\\\\\"decision\\\\\"}}\\\\n if config.prediction_kind not in compatible[metric.kind]:\\\\n raise ValueError(f\\\\\"Metric {config.metric} cannot consume {config.prediction_kind} predictions\\\\\")\\\\n return metric\\\\n\\\\n\\\\ndef labels_from_probabilities(predictions, config):\\\\n predictions = np.asarray(predictions)\\\\n if len(config.class_order) == 2:\\\\n if config.positive_class not in config.class_order or config.label_threshold is None or not 0 <= config.label_threshold <= 1:\\\\n raise ValueError(\\\\\"Binary label conversion requires positive_class and label_threshold in [0, 1]\\\\\")\\\\n positive = config.class_order.index(config.positive_class)\\\\n indices = np.where(predictions[:, positive] >= config.label_threshold, positive, 1 - positive)\\\\n else:\\\\n indices = predictions.argmax(axis=1)\\\\n return np.asarray(config.class_order)[indices]\\\\n\\\\n\\\\ndef score(y, predictions, config):\\\\n metric = metric_definition(config)\\\\n y, predictions = np.asarray(y), np.asarray(predictions)\\\\n if config.prediction_kind != \\\\\"label\\\\\" and not np.isfinite(predictions.astype(float)).all():\\\\n raise ValueError(\\\\\"Non-finite predictions cannot be scored\\\\\")\\\\n if config.prediction_kind == \\\\\"probability\\\\\":\\\\n if predictions.shape != (len(y), len(config.class_order)) or (predictions < 0).any() or (predictions > 1).any() or not np.allclose(predictions.sum(axis=1), 1, atol=1e-6, rtol=0):\\\\n raise ValueError(\\\\\"Metric requires valid probabilities in the configured class order\\\\\")\\\\n params = dict(config.metric_params)\\\\n if metric.kind == \\\\\"label\\\\\" and config.prediction_kind == \\\\\"probability\\\\\":\\\\n predictions = labels_from_probabilities(predictions, config)\\\\n if config.metric == \\\\\"log_loss\\\\\":\\\\n mapping = {label: i for i, label in enumerate(config.class_order)}\\\\n y = np.array([mapping[label] for label in y])\\\\n params[\\\\\"labels\\\\\"] = np.arange(len(config.class_order))\\\\n elif config.metric in {\\\\\"roc_auc\\\\\", \\\\\"average_precision\\\\\"}:\\\\n if len(config.class_order) == 2:\\\\n if config.positive_class not in config.class_order:\\\\n raise ValueError(\\\\\"Binary ranking metrics require an explicit positive_class\\\\\")\\\\n positive = config.class_order.index(config.positive_class)\\\\n y = (y == config.positive_class).astype(int)\\\\n if config.prediction_kind == \\\\\"probability\\\\\":\\\\n predictions = predictions[:, positive]\\\\n elif positive == 0:\\\\n predictions = -predictions\\\\n else:\\\\n if config.metric != \\\\\"roc_auc\\\\\" or config.prediction_kind != \\\\\"probability\\\\\":\\\\n raise ValueError(\\\\\"This helper supports multiclass ROC AUC with probabilities; otherwise add a custom metric\\\\\")\\\\n if not {\\\\\"average\\\\\", \\\\\"multi_class\\\\\"} <= params.keys():\\\\n raise ValueError(\\\\\"Multiclass ROC AUC needs explicit average and multi_class parameters\\\\\")\\\\n mapping = {label: i for i, label in enumerate(config.class_order)}\\\\n y = np.array([mapping[label] for label in y])\\\\n params[\\\\\"labels\\\\\"] = np.arange(len(config.class_order))\\\\n value = float(metric.function(y, predictions, **params))\\\\n if not np.isfinite(value):\\\\n raise ValueError(\\\\\"Metric is undefined for this fold; investigate validation instead of ignoring the fold\\\\\")\\\\n return value\\\\n\",\\n \"predict.py\": \"\\\\\"\\\\\"\\\\\"Saved-pipeline inference and prediction artifacts with explicit identity metadata.\\\\\"\\\\\"\\\\\"\\\\nif __package__ in {None, \\\\\"\\\\\"}:\\\\n import sys\\\\n from pathlib import Path\\\\n sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\\\\n __package__ = \\\\\"src\\\\\"\\\\n\\\\nimport argparse\\\\nfrom pathlib import Path\\\\nimport pickle\\\\nimport numpy as np\\\\nimport pandas as pd\\\\nfrom .config import Config, ROOT\\\\nfrom .data import load_test\\\\nfrom .utils import checked_record, finish_record, object_hash, read_json, save_frame, save_json, sha256\\\\n\\\\n\\\\ndef model_predictions(pipeline, features, config):\\\\n if config.prediction_kind == \\\\\"probability\\\\\":\\\\n if not hasattr(pipeline, \\\\\"predict_proba\\\\\"):\\\\n raise ValueError(\\\\\"Model does not provide probabilities\\\\\")\\\\n predictions = pipeline.predict_proba(features)\\\\n classes = list(pipeline.classes_)\\\\n if set(classes) != set(range(len(config.class_order))):\\\\n raise ValueError(\\\\\"Fitted model classes differ from the configured class mapping\\\\\")\\\\n return predictions[:, [classes.index(i) for i in range(len(config.class_order))]]\\\\n if config.prediction_kind == \\\\\"decision\\\\\":\\\\n if not hasattr(pipeline, \\\\\"decision_function\\\\\"):\\\\n raise ValueError(\\\\\"Model does not provide decision scores\\\\\")\\\\n return pipeline.decision_function(features)\\\\n predictions = pipeline.predict(features)\\\\n if config.task == \\\\\"classification\\\\\":\\\\n return np.asarray(config.class_order)[np.asarray(predictions, dtype=int)]\\\\n return predictions\\\\n\\\\n\\\\ndef save_predictions(path, frame, predictions, config, fingerprint, *, folds=None, split_signature=None):\\\\n predictions = np.asarray(predictions)\\\\n if predictions.ndim == 1:\\\\n predictions = predictions[:, None]\\\\n if len(predictions) != len(frame):\\\\n raise ValueError(\\\\\"Prediction row count mismatch\\\\\")\\\\n result = pd.DataFrame({\\\\\"__row__\\\\\": np.arange(len(frame))})\\\\n for column in config.id_columns:\\\\n result[column] = frame[column].reset_index(drop=True).astype(\\\\\"string\\\\\")\\\\n identity = object_hash(result.to_dict(orient=\\\\\"list\\\\\"))\\\\n if folds is not None:\\\\n result[\\\\\"__fold__\\\\\"] = folds\\\\n columns = [f\\\\\"pred_{i}\\\\\" for i in range(predictions.shape[1])]\\\\n for i, column in enumerate(columns):\\\\n result[column] = predictions[:, i]\\\\n save_frame(path, result)\\\\n metadata = {\\\\\"prediction_kind\\\\\": config.prediction_kind, \\\\\"class_order\\\\\": config.class_order,\\\\n \\\\\"prediction_columns\\\\\": columns, \\\\\"id_columns\\\\\": config.id_columns,\\\\n \\\\\"data_fingerprint\\\\\": fingerprint, \\\\\"identity_hash\\\\\": identity,\\\\n \\\\\"split_signature\\\\\": split_signature, \\\\\"sha256\\\\\": sha256(path)}\\\\n save_json(Path(path).with_suffix(\\\\\".meta.json\\\\\"), metadata, exclusive=True)\\\\n return metadata\\\\n\\\\n\\\\ndef read_predictions(path):\\\\n path = Path(path)\\\\n metadata = read_json(path.with_suffix(\\\\\".meta.json\\\\\"))\\\\n if sha256(path) != metadata[\\\\\"sha256\\\\\"]:\\\\n raise ValueError(f\\\\\"Prediction artifact integrity check failed: {path.name}\\\\\")\\\\n dtype = {column: \\\\\"string\\\\\" for column in metadata[\\\\\"id_columns\\\\\"]}\\\\n if metadata[\\\\\"prediction_kind\\\\\"] == \\\\\"label\\\\\" and all(isinstance(c, str) for c in metadata[\\\\\"class_order\\\\\"]):\\\\n dtype.update({column: \\\\\"string\\\\\" for column in metadata[\\\\\"prediction_columns\\\\\"]})\\\\n frame = pd.read_csv(path, dtype=dtype)\\\\n identity = frame[[\\\\\"__row__\\\\\", *metadata[\\\\\"id_columns\\\\\"]]]\\\\n if object_hash(identity.to_dict(orient=\\\\\"list\\\\\")) != metadata[\\\\\"identity_hash\\\\\"]:\\\\n raise ValueError(\\\\\"Prediction identity metadata mismatch\\\\\")\\\\n predictions = frame[metadata[\\\\\"prediction_columns\\\\\"]].to_numpy()\\\\n if predictions.shape[1] == 1:\\\\n predictions = predictions[:, 0]\\\\n return frame, predictions, metadata\\\\n\\\\n\\\\ndef predict_experiment(root, experiment, *, test_file=None, aggregation=None):\\\\n root = Path(root)\\\\n record = checked_record(root, experiment)\\\\n config = Config(**record[\\\\\"config\\\\\"])\\\\n if record.get(\\\\\"ensemble\\\\\"):\\\\n raise ValueError(\\\\\"Infer ensemble members first, then blend under a new experiment ID\\\\\")\\\\n if aggregation != \\\\\"mean\\\\\" or config.prediction_kind == \\\\\"label\\\\\":\\\\n raise ValueError(\\\\\"Inference requires explicit aggregation=\\'mean\\' and numeric predictions\\\\\")\\\\n if record.get(\\\\\"prediction_path\\\\\"):\\\\n raise FileExistsError(\\\\\"Predictions already exist; they will not be overwritten\\\\\")\\\\n if test_file:\\\\n config.test_file = test_file\\\\n frame, fingerprint = load_test(config, root)\\\\n accumulated = None\\\\n for path in record[\\\\\"model_paths\\\\\"]:\\\\n model_path = root / path\\\\n if sha256(model_path) != record[\\\\\"model_hashes\\\\\"][path]:\\\\n raise ValueError(\\\\\"Saved model integrity check failed\\\\\")\\\\n with model_path.open(\\\\\"rb\\\\\") as handle:\\\\n pipeline = pickle.load(handle) # Only artifacts generated by this trusted repository.\\\\n predictions = model_predictions(pipeline, frame[config.features], config)\\\\n accumulated = predictions.astype(float) if accumulated is None else accumulated + predictions\\\\n predictions = accumulated / len(record[\\\\\"model_paths\\\\\"])\\\\n if not np.isfinite(predictions).all():\\\\n raise ValueError(\\\\\"Inference generated non-finite predictions\\\\\")\\\\n path = f\\\\\"outputs/predictions/{experiment}.csv\\\\\"\\\\n save_predictions(root / path, frame, predictions, config, fingerprint)\\\\n record.update(prediction_path=path, test_fingerprint=fingerprint,\\\\n inference={\\\\\"test_file\\\\\": config.test_file, \\\\\"aggregation\\\\\": aggregation})\\\\n finish_record(root, record)\\\\n return record\\\\n\\\\n\\\\ndef main():\\\\n parser = argparse.ArgumentParser(description=__doc__)\\\\n parser.add_argument(\\\\\"--root\\\\\", type=Path, default=ROOT)\\\\n parser.add_argument(\\\\\"--experiment\\\\\", required=True)\\\\n parser.add_argument(\\\\\"--test-file\\\\\")\\\\n parser.add_argument(\\\\\"--aggregation\\\\\", required=True, choices=[\\\\\"mean\\\\\"])\\\\n args = parser.parse_args()\\\\n try:\\\\n result = predict_experiment(args.root, args.experiment, test_file=args.test_file, aggregation=args.aggregation)\\\\n print(result[\\\\\"prediction_path\\\\\"])\\\\n except (ValueError, OSError, ImportError) as exc:\\\\n parser.exit(2, f\\\\\"Inference stopped: {exc}\\\\\\\\n\\\\\")\\\\n\\\\n\\\\nif __name__ == \\\\\"__main__\\\\\":\\\\n main()\\\\n\",\\n \"submission.py\": \"\\\\\"\\\\\"\\\\\"Validate and generate local CSVs only. There is no Kaggle upload function.\\\\\"\\\\\"\\\\\"\\\\nif __package__ in {None, \\\\\"\\\\\"}:\\\\n import sys\\\\n from pathlib import Path\\\\n sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\\\\n __package__ = \\\\\"src\\\\\"\\\\n\\\\nimport argparse\\\\nfrom pathlib import Path\\\\nimport re\\\\nimport numpy as np\\\\nimport pandas as pd\\\\nfrom .config import Config, ROOT, load_config\\\\nfrom .data import read_table, require_columns\\\\nfrom .metrics import labels_from_probabilities\\\\nfrom .predict import read_predictions\\\\nfrom .utils import checked_record, finish_record, save_frame, save_json, sha256\\\\n\\\\nSUBMISSION_FIELDS = (\\\\\"sample_file\\\\\", \\\\\"submission_columns\\\\\", \\\\\"submission_kind\\\\\", \\\\\"submission_alignment\\\\\", \\\\\"positive_class\\\\\", \\\\\"label_threshold\\\\\")\\\\n\\\\n\\\\ndef validate_probabilities(values, *, sums=False):\\\\n values = np.asarray(values, dtype=float)\\\\n if not np.isfinite(values).all() or (values < 0).any() or (values > 1).any():\\\\n raise ValueError(\\\\\"Probabilities must be finite and in [0, 1]; no automatic correction\\\\\")\\\\n if sums and (values.ndim != 2 or not np.allclose(values.sum(axis=1), 1, atol=1e-6, rtol=0)):\\\\n raise ValueError(\\\\\"Multiclass probability rows must sum to 1 within 1e-6\\\\\")\\\\n\\\\n\\\\ndef build_submission(sample, artifact, predictions, metadata, config):\\\\n if len(sample) != len(artifact) or len(predictions) != len(sample):\\\\n raise ValueError(\\\\\"Sample/prediction row count mismatch\\\\\")\\\\n if not config.submission_columns or not config.submission_kind:\\\\n raise ValueError(\\\\\"Configure submission_columns and submission_kind from Evaluation\\\\\")\\\\n expected = [c for c in sample.columns if c not in config.id_columns]\\\\n if expected != config.submission_columns:\\\\n raise ValueError(\\\\\"Configured prediction columns/order do not exactly match sample submission\\\\\")\\\\n if any(str(c).lower().startswith(\\\\\"unnamed:\\\\\") for c in sample):\\\\n raise ValueError(\\\\\"Sample contains an apparent accidental index column; inspect the official format\\\\\")\\\\n if metadata[\\\\\"prediction_kind\\\\\"] != config.prediction_kind or metadata[\\\\\"class_order\\\\\"] != config.class_order or metadata[\\\\\"id_columns\\\\\"] != config.id_columns:\\\\n raise ValueError(\\\\\"Prediction metadata is incompatible with the submission configuration\\\\\")\\\\n if config.submission_alignment == \\\\\"id\\\\\":\\\\n if not config.id_columns:\\\\n raise ValueError(\\\\\"ID alignment requires explicit id_columns\\\\\")\\\\n for frame in (sample, artifact):\\\\n require_columns(frame, config.id_columns, \\\\\"Submission IDs\\\\\")\\\\n if frame[config.id_columns].isna().any().any() or frame.duplicated(config.id_columns).any():\\\\n raise ValueError(\\\\\"Submission IDs must be unique and nonmissing\\\\\")\\\\n def keys(frame):\\\\n return list(frame[config.id_columns].astype(\\\\\"string\\\\\").itertuples(index=False, name=None))\\\\n sample_keys, prediction_keys = keys(sample), keys(artifact)\\\\n if set(sample_keys) != set(prediction_keys):\\\\n raise ValueError(\\\\\"Sample and predictions have different IDs\\\\\")\\\\n positions = {key: i for i, key in enumerate(prediction_keys)}\\\\n predictions = np.asarray(predictions)[[positions[key] for key in sample_keys]]\\\\n elif config.submission_alignment == \\\\\"position\\\\\":\\\\n if config.id_columns:\\\\n raise ValueError(\\\\\"Use ID alignment when id_columns are configured\\\\\")\\\\n if not np.array_equal(artifact[\\\\\"__row__\\\\\"].to_numpy(), np.arange(len(sample))):\\\\n raise ValueError(\\\\\"Positional predictions must retain original test row order\\\\\")\\\\n else:\\\\n raise ValueError(\\\\\"Choose submission_alignment=\\'id\\' or explicitly \\'position\\'\\\\\")\\\\n values = np.asarray(predictions)\\\\n if config.prediction_kind == \\\\\"probability\\\\\":\\\\n validate_probabilities(values, sums=True)\\\\n if config.submission_kind == \\\\\"label\\\\\":\\\\n if config.prediction_kind == \\\\\"probability\\\\\":\\\\n values = labels_from_probabilities(values, config)\\\\n elif config.prediction_kind != \\\\\"label\\\\\":\\\\n raise ValueError(\\\\\"Label output needs labels or an explicit probability decision rule\\\\\")\\\\n if len(config.submission_columns) != 1 or not set(values.ravel()) <= set(config.class_order):\\\\n raise ValueError(\\\\\"Label output must contain one column of configured class labels\\\\\")\\\\n elif config.submission_kind == \\\\\"probability\\\\\":\\\\n if config.prediction_kind != \\\\\"probability\\\\\":\\\\n raise ValueError(\\\\\"Probability output requires probability predictions\\\\\")\\\\n if len(config.submission_columns) == 1:\\\\n if len(config.class_order) != 2 or config.positive_class not in config.class_order:\\\\n raise ValueError(\\\\\"Single probability column requires binary classes and explicit positive_class\\\\\")\\\\n values = values[:, config.class_order.index(config.positive_class)]\\\\n elif len(config.submission_columns) != len(config.class_order):\\\\n raise ValueError(\\\\\"Probability columns must follow the complete configured class_order\\\\\")\\\\n elif config.submission_kind == \\\\\"value\\\\\":\\\\n if config.prediction_kind != \\\\\"value\\\\\":\\\\n raise ValueError(\\\\\"Value output requires regression-value predictions\\\\\")\\\\n else:\\\\n raise ValueError(\\\\\"submission_kind must be value, label, or probability\\\\\")\\\\n if values.ndim == 1:\\\\n values = values[:, None]\\\\n if values.shape != (len(sample), len(config.submission_columns)):\\\\n raise ValueError(\\\\\"Prediction shape does not match the official template\\\\\")\\\\n if pd.isna(values).any():\\\\n raise ValueError(\\\\\"Submission predictions contain missing values\\\\\")\\\\n if config.submission_kind != \\\\\"label\\\\\" and not np.isfinite(values.astype(float)).all():\\\\n raise ValueError(\\\\\"Submission predictions contain non-finite values\\\\\")\\\\n result = sample.copy()\\\\n for i, column in enumerate(config.submission_columns):\\\\n result[column] = values[:, i]\\\\n if list(result.columns) != list(sample.columns) or result.isna().any().any():\\\\n raise ValueError(\\\\\"Submission schema changed or contains missing values\\\\\")\\\\n return result\\\\n\\\\n\\\\ndef generate_submission(root, experiment, *, config=None, description=\\\\\"baseline\\\\\"):\\\\n root = Path(root)\\\\n record = checked_record(root, experiment)\\\\n resolved = Config(**record[\\\\\"config\\\\\"])\\\\n if config:\\\\n for key in SUBMISSION_FIELDS:\\\\n setattr(resolved, key, getattr(config, key))\\\\n if not re.fullmatch(r\\\\\"[a-zA-Z0-9][a-zA-Z0-9_-]*\\\\\", description):\\\\n raise ValueError(\\\\\"Description must contain only letters, digits, underscores, or hyphens\\\\\")\\\\n if not record.get(\\\\\"prediction_path\\\\\"):\\\\n raise ValueError(\\\\\"Generate test predictions explicitly before creating a submission\\\\\")\\\\n sample_path = resolved.path(root, resolved.sample_file)\\\\n sample = read_table(sample_path, id_columns=resolved.id_columns)\\\\n artifact, predictions, metadata = read_predictions(root / record[\\\\\"prediction_path\\\\\"])\\\\n if metadata[\\\\\"data_fingerprint\\\\\"] != record[\\\\\"test_fingerprint\\\\\"]:\\\\n raise ValueError(\\\\\"Prediction data fingerprint disagrees with experiment provenance\\\\\")\\\\n result = build_submission(sample, artifact, predictions, metadata, resolved)\\\\n score_text = f\\\\\"{record[\\'cv_mean\\']:.6f}\\\\\".replace(\\\\\"-\\\\\", \\\\\"m\\\\\").replace(\\\\\".\\\\\", \\\\\"p\\\\\")\\\\n filename = f\\\\\"sub_{experiment}_{record[\\'model\\']}_{description}_cv{score_text}.csv\\\\\"\\\\n path = root / \\\\\"submissions\\\\\" / filename\\\\n save_frame(path, result)\\\\n submission_record = {\\\\\"experiment_id\\\\\": experiment, \\\\\"submission_path\\\\\": f\\\\\"submissions/{filename}\\\\\",\\\\n \\\\\"sha256\\\\\": sha256(path), \\\\\"sample_sha256\\\\\": sha256(sample_path),\\\\n \\\\\"prediction_sha256\\\\\": metadata[\\\\\"sha256\\\\\"], \\\\\"git_commit\\\\\": record[\\\\\"git_commit\\\\\"],\\\\n \\\\\"config\\\\\": {key: getattr(resolved, key) for key in SUBMISSION_FIELDS},\\\\n \\\\\"kaggle_notebook_version\\\\\": None, \\\\\"uploaded\\\\\": False}\\\\n save_json(path.with_suffix(\\\\\".json\\\\\"), submission_record, exclusive=True)\\\\n record.setdefault(\\\\\"submissions\\\\\", []).append(submission_record)\\\\n record[\\\\\"submission_path\\\\\"] = submission_record[\\\\\"submission_path\\\\\"]\\\\n finish_record(root, record)\\\\n return path\\\\n\\\\n\\\\ndef main():\\\\n parser = argparse.ArgumentParser(description=__doc__)\\\\n parser.add_argument(\\\\\"--root\\\\\", type=Path, default=ROOT)\\\\n parser.add_argument(\\\\\"--experiment\\\\\", required=True)\\\\n parser.add_argument(\\\\\"--config\\\\\", type=Path, help=\\\\\"Override only submission fields using a complete config JSON\\\\\")\\\\n parser.add_argument(\\\\\"--description\\\\\", default=\\\\\"baseline\\\\\")\\\\n args = parser.parse_args()\\\\n try:\\\\n print(generate_submission(args.root, args.experiment, config=load_config(args.config) if args.config else None, description=args.description))\\\\n except (ValueError, OSError, ImportError) as exc:\\\\n parser.exit(2, f\\\\\"Submission stopped: {exc}\\\\\\\\n\\\\\")\\\\n\\\\n\\\\nif __name__ == \\\\\"__main__\\\\\":\\\\n main()\\\\n\",\\n \"train.py\": \"\\\\\"\\\\\"\\\\\"Explicit CV training. Test inference happens only after all fitting is complete.\\\\\"\\\\\"\\\\\"\\\\nif __package__ in {None, \\\\\"\\\\\"}:\\\\n import sys\\\\n from pathlib import Path\\\\n sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\\\\n __package__ = \\\\\"src\\\\\"\\\\n\\\\nimport argparse\\\\nfrom pathlib import Path\\\\nimport pickle\\\\nimport time\\\\nimport traceback\\\\nimport numpy as np\\\\nfrom sklearn.base import clone\\\\nfrom .config import ROOT, load_config\\\\nfrom .data import load_training\\\\nfrom .features import build_pipeline\\\\nfrom .metrics import metric_definition, score\\\\nfrom .predict import model_predictions, predict_experiment, save_predictions\\\\nfrom .utils import environment, finish_record, reserve_experiment, save_json, seed_everything, sha256, snapshot_source\\\\nfrom .validation import make_splits\\\\n\\\\n\\\\ndef train_experiment(config, experiment, hypothesis, change, *, root=ROOT, parent=None):\\\\n root = Path(root)\\\\n config.validate()\\\\n metric_definition(config)\\\\n template = build_pipeline(config) # Optional dependencies checked before reserving the ID.\\\\n frame, fingerprint = load_training(config, root)\\\\n reuse = config.path(root, config.splits_file) if config.splits_file else None\\\\n pairs, assignment, splits = make_splits(frame, config, fingerprint, reuse=reuse)\\\\n if config.task == \\\\\"classification\\\\\":\\\\n if set(frame[config.target]) != set(config.class_order):\\\\n raise ValueError(\\\\\"class_order does not match the training labels\\\\\")\\\\n encoded_y = frame[config.target].map({label: i for i, label in enumerate(config.class_order)})\\\\n else:\\\\n encoded_y = frame[config.target]\\\\n record = reserve_experiment(root, experiment, config, hypothesis, change, parent)\\\\n start = time.perf_counter()\\\\n try:\\\\n seed_everything(config.seed)\\\\n provenance = root / record[\\\\\"provenance_path\\\\\"]\\\\n record[\\\\\"source_hashes\\\\\"] = snapshot_source(provenance / \\\\\"source\\\\\")\\\\n save_json(provenance / \\\\\"config.json\\\\\", config.to_dict(), exclusive=True)\\\\n save_json(provenance / \\\\\"environment.json\\\\\", environment(), exclusive=True)\\\\n save_json(provenance / \\\\\"splits.json\\\\\", splits, exclusive=True)\\\\n record.update(train_fingerprint=fingerprint, split_signature=splits[\\\\\"signature\\\\\"],\\\\n splits_path=f\\\\\"{record[\\'provenance_path\\']}splits.json\\\\\", model_paths=[], model_hashes={})\\\\n scores, oof, fitted_parameters = [], None, []\\\\n model_dir = root / \\\\\"outputs/models\\\\\" / experiment\\\\n model_dir.mkdir(parents=True, exist_ok=False)\\\\n log = []\\\\n for fold, (training, valid) in enumerate(pairs):\\\\n pipeline = clone(template)\\\\n pipeline.fit(frame.iloc[training][config.features], encoded_y.iloc[training])\\\\n predictions = np.asarray(model_predictions(pipeline, frame.iloc[valid][config.features], config))\\\\n if oof is None:\\\\n shape = (len(frame), *predictions.shape[1:])\\\\n oof = np.full(shape, None, dtype=object) if config.prediction_kind == \\\\\"label\\\\\" else np.full(shape, np.nan)\\\\n oof[valid] = predictions\\\\n fold_score = score(frame.iloc[valid][config.target], predictions, config)\\\\n scores.append(fold_score)\\\\n message = f\\\\\"{experiment} fold {fold + 1}/{len(pairs)}: {fold_score:.8g}\\\\\"\\\\n print(message)\\\\n log.append(message)\\\\n relative = f\\\\\"outputs/models/{experiment}/fold_{fold}.pkl\\\\\"\\\\n with (root / relative).open(\\\\\"xb\\\\\") as handle:\\\\n pickle.dump(pipeline, handle, protocol=pickle.HIGHEST_PROTOCOL)\\\\n record[\\\\\"model_paths\\\\\"].append(relative)\\\\n record[\\\\\"model_hashes\\\\\"][relative] = sha256(root / relative)\\\\n fitted_parameters.append(pipeline.named_steps[\\\\\"model\\\\\"].get_params())\\\\n oof_path = f\\\\\"outputs/oof/{experiment}.csv\\\\\"\\\\n save_predictions(root / oof_path, frame, oof, config, fingerprint, folds=assignment, split_signature=splits[\\\\\"signature\\\\\"])\\\\n record.update(status=\\\\\"completed\\\\\", fold_scores=scores, cv_mean=float(np.mean(scores)),\\\\n cv_std=float(np.std(scores, ddof=0)), cv_std_definition=\\\\\"population std (ddof=0)\\\\\",\\\\n oof_coverage=float(np.mean(assignment >= 0)), oof_path=oof_path,\\\\n training_seconds=time.perf_counter() - start,\\\\n fitted_model_parameters=fitted_parameters)\\\\n save_json(provenance / \\\\\"model_parameters.json\\\\\", fitted_parameters, exclusive=True)\\\\n (provenance / \\\\\"training.log\\\\\").write_text(\\\\\"\\\\\\\\n\\\\\".join(log) + \\\\\"\\\\\\\\n\\\\\", encoding=\\\\\"utf-8\\\\\")\\\\n finish_record(root, record)\\\\n except BaseException as exc:\\\\n record.update(status=\\\\\"failed\\\\\", error=f\\\\\"{type(exc).__name__}: {exc}\\\\\", traceback=traceback.format_exc(),\\\\n training_seconds=time.perf_counter() - start)\\\\n finish_record(root, record)\\\\n raise\\\\n if config.predict_test:\\\\n try:\\\\n record = predict_experiment(root, experiment, aggregation=config.aggregation)\\\\n except Exception as exc:\\\\n record[\\\\\"inference_error\\\\\"] = f\\\\\"{type(exc).__name__}: {exc}\\\\\"\\\\n finish_record(root, record)\\\\n raise\\\\n print(f\\\\\"CV {record[\\'cv_mean\\']:.8g} +/- {record[\\'cv_std\\']:.8g}; OOF coverage {record[\\'oof_coverage\\']:.1%}\\\\\")\\\\n return record\\\\n\\\\n\\\\ndef main():\\\\n parser = argparse.ArgumentParser(description=__doc__)\\\\n parser.add_argument(\\\\\"--root\\\\\", type=Path, default=ROOT)\\\\n parser.add_argument(\\\\\"--config\\\\\", type=Path)\\\\n parser.add_argument(\\\\\"--model\\\\\")\\\\n parser.add_argument(\\\\\"--experiment\\\\\", required=True)\\\\n parser.add_argument(\\\\\"--seed\\\\\", type=int)\\\\n parser.add_argument(\\\\\"--hypothesis\\\\\", required=True)\\\\n parser.add_argument(\\\\\"--change\\\\\", required=True)\\\\n parser.add_argument(\\\\\"--parent\\\\\")\\\\n group = parser.add_mutually_exclusive_group()\\\\n group.add_argument(\\\\\"--predict-test\\\\\", action=\\\\\"store_true\\\\\", default=None)\\\\n group.add_argument(\\\\\"--no-test-inference\\\\\", dest=\\\\\"predict_test\\\\\", action=\\\\\"store_false\\\\\")\\\\n parser.add_argument(\\\\\"--aggregation\\\\\", choices=[\\\\\"mean\\\\\"])\\\\n args = parser.parse_args()\\\\n try:\\\\n config = load_config(args.config)\\\\n for key in (\\\\\"model\\\\\", \\\\\"seed\\\\\", \\\\\"predict_test\\\\\", \\\\\"aggregation\\\\\"):\\\\n if getattr(args, key) is not None:\\\\n setattr(config, key, getattr(args, key))\\\\n train_experiment(config, args.experiment, args.hypothesis, args.change, root=args.root, parent=args.parent)\\\\n except (ValueError, OSError, ImportError, TypeError) as exc:\\\\n parser.exit(2, f\\\\\"Training stopped: {exc}\\\\\\\\n\\\\\")\\\\n\\\\n\\\\nif __name__ == \\\\\"__main__\\\\\":\\\\n main()\\\\n\",\\n \"utils.py\": \"\\\\\"\\\\\"\\\\\"Provenance, exclusive artifact creation, and a deliberately small CSV ledger.\\\\\"\\\\\"\\\\\"\\\\nimport csv\\\\nimport hashlib\\\\nimport importlib.metadata\\\\nimport json\\\\nimport os\\\\nfrom pathlib import Path\\\\nimport random\\\\nimport re\\\\nimport subprocess\\\\nfrom datetime import datetime, timezone\\\\n\\\\nTRACKER_COLUMNS = \\\\\"experiment_id timestamp parent_experiment model hypothesis change_description validation_method n_folds seed cv_mean cv_std fold_scores public_lb private_lb parameters oof_path prediction_path submission_path git_commit status conclusion notes training_seconds provenance_path kaggle_notebook_version\\\\\".split()\\\\n\\\\n\\\\ndef now():\\\\n return datetime.now(timezone.utc).isoformat()\\\\n\\\\n\\\\ndef json_default(value):\\\\n if hasattr(value, \\\\\"item\\\\\"):\\\\n return value.item()\\\\n if hasattr(value, \\\\\"tolist\\\\\"):\\\\n return value.tolist()\\\\n if isinstance(value, Path):\\\\n return str(value)\\\\n raise TypeError(f\\\\\"Not JSON serializable: {type(value).__name__}\\\\\")\\\\n\\\\n\\\\ndef dumps(value):\\\\n return json.dumps(value, indent=2, default=json_default, allow_nan=False)\\\\n\\\\n\\\\ndef save_json(path, value, *, exclusive=False):\\\\n path = Path(path)\\\\n path.parent.mkdir(parents=True, exist_ok=True)\\\\n text = dumps(value)\\\\n if exclusive:\\\\n with path.open(\\\\\"x\\\\\", encoding=\\\\\"utf-8\\\\\", newline=\\\\\"\\\\\\\\n\\\\\") as handle:\\\\n handle.write(text + \\\\\"\\\\\\\\n\\\\\")\\\\n else:\\\\n temporary = path.with_name(path.name + f\\\\\".{os.getpid()}.tmp\\\\\")\\\\n temporary.write_text(text + \\\\\"\\\\\\\\n\\\\\", encoding=\\\\\"utf-8\\\\\")\\\\n temporary.replace(path)\\\\n\\\\n\\\\ndef read_json(path):\\\\n return json.loads(Path(path).read_text(encoding=\\\\\"utf-8\\\\\"))\\\\n\\\\n\\\\ndef sha256(path):\\\\n digest = hashlib.sha256()\\\\n with Path(path).open(\\\\\"rb\\\\\") as handle:\\\\n for chunk in iter(lambda: handle.read(1024 * 1024), b\\\\\"\\\\\"):\\\\n digest.update(chunk)\\\\n return digest.hexdigest()\\\\n\\\\n\\\\ndef object_hash(value):\\\\n return hashlib.sha256(dumps(value).encode()).hexdigest()\\\\n\\\\n\\\\ndef seed_everything(seed):\\\\n import numpy as np\\\\n random.seed(seed)\\\\n np.random.seed(seed)\\\\n\\\\n\\\\ndef git_info(root):\\\\n def git(*args):\\\\n result = subprocess.run([\\\\\"git\\\\\", \\\\\"-C\\\\\", str(root), *args], capture_output=True, text=True)\\\\n return result.stdout.strip() if result.returncode == 0 else None\\\\n try:\\\\n commit = git(\\\\\"rev-parse\\\\\", \\\\\"HEAD\\\\\")\\\\n status = git(\\\\\"status\\\\\", \\\\\"--porcelain\\\\\")\\\\n return {\\\\\"git_commit\\\\\": commit, \\\\\"git_dirty\\\\\": bool(status) if status is not None else None,\\\\n \\\\\"git_note\\\\\": None if commit else \\\\\"No committed Git version; commit before a serious candidate.\\\\\"}\\\\n except FileNotFoundError:\\\\n return {\\\\\"git_commit\\\\\": None, \\\\\"git_dirty\\\\\": None, \\\\\"git_note\\\\\": \\\\\"Git is unavailable.\\\\\"}\\\\n\\\\n\\\\ndef snapshot_source(destination):\\\\n source = Path(__file__).resolve().parent\\\\n destination = Path(destination)\\\\n destination.mkdir(parents=True, exist_ok=False)\\\\n hashes = {}\\\\n for path in sorted(source.glob(\\\\\"*.py\\\\\")):\\\\n content = path.read_bytes()\\\\n (destination / path.name).write_bytes(content)\\\\n hashes[path.name] = sha256(path)\\\\n return hashes\\\\n\\\\n\\\\ndef environment():\\\\n import platform\\\\n return {\\\\\"python\\\\\": platform.python_version(), \\\\\"platform\\\\\": platform.platform(),\\\\n \\\\\"packages\\\\\": {d.metadata[\\\\\"Name\\\\\"]: d.version for d in importlib.metadata.distributions()}}\\\\n\\\\n\\\\ndef update_tracker(root, record):\\\\n path = Path(root) / \\\\\"experiments/experiments.csv\\\\\"\\\\n path.parent.mkdir(parents=True, exist_ok=True)\\\\n lock = path.with_suffix(\\\\\".lock\\\\\")\\\\n try:\\\\n descriptor = os.open(lock, os.O_CREAT | os.O_EXCL | os.O_WRONLY)\\\\n except FileExistsError as exc:\\\\n raise RuntimeError(\\\\\"Tracker is being edited by another process; do not run concurrent experiments.\\\\\") from exc\\\\n try:\\\\n os.close(descriptor)\\\\n rows = []\\\\n fields = TRACKER_COLUMNS.copy()\\\\n if path.exists():\\\\n with path.open(newline=\\\\\"\\\\\", encoding=\\\\\"utf-8\\\\\") as handle:\\\\n reader = csv.DictReader(handle)\\\\n fields += [f for f in (reader.fieldnames or []) if f not in fields]\\\\n rows = list(reader)\\\\n row = next((r for r in rows if r[\\\\\"experiment_id\\\\\"] == record[\\\\\"experiment_id\\\\\"]), None)\\\\n if row is None:\\\\n row = {\\\\\"experiment_id\\\\\": record[\\\\\"experiment_id\\\\\"]}\\\\n rows.append(row)\\\\n for key in fields:\\\\n if key in record:\\\\n value = record[key]\\\\n row[key] = json.dumps(value, default=json_default, allow_nan=False) if isinstance(value, (dict, list)) else value\\\\n temporary = path.with_suffix(\\\\\".tmp\\\\\")\\\\n with temporary.open(\\\\\"w\\\\\", newline=\\\\\"\\\\\", encoding=\\\\\"utf-8\\\\\") as handle:\\\\n writer = csv.DictWriter(handle, fieldnames=fields)\\\\n writer.writeheader()\\\\n writer.writerows(rows)\\\\n temporary.replace(path)\\\\n finally:\\\\n lock.unlink()\\\\n\\\\n\\\\ndef report_path(root, experiment):\\\\n if not re.fullmatch(r\\\\\"(?:E\\\\\\\\d{3,}|SMOKE\\\\\\\\d{3,})\\\\\", experiment):\\\\n raise ValueError(\\\\\"Use a unique ID such as E001 (SMOKE001 is reserved for isolated tests)\\\\\")\\\\n return Path(root) / \\\\\"outputs/reports\\\\\" / f\\\\\"{experiment}.json\\\\\"\\\\n\\\\n\\\\ndef reserve_experiment(root, experiment, config, hypothesis, change, parent=None):\\\\n if not hypothesis.strip() or not change.strip():\\\\n raise ValueError(\\\\\"A hypothesis and change description are required\\\\\")\\\\n if experiment.startswith(\\\\\"SMOKE\\\\\") != config.smoke_test:\\\\n raise ValueError(\\\\\"SMOKE IDs require smoke_test=true; competition runs require E IDs\\\\\")\\\\n path = report_path(root, experiment)\\\\n ledger = Path(root) / \\\\\"experiments/experiments.csv\\\\\"\\\\n if ledger.exists():\\\\n with ledger.open(newline=\\\\\"\\\\\", encoding=\\\\\"utf-8\\\\\") as handle:\\\\n if any(row[\\\\\"experiment_id\\\\\"] == experiment for row in csv.DictReader(handle)):\\\\n raise FileExistsError(f\\\\\"Experiment {experiment} already appears in the ledger; IDs are never reused\\\\\")\\\\n for artifact in (Path(root) / \\\\\"outputs/models\\\\\" / experiment,\\\\n Path(root) / \\\\\"outputs/reports\\\\\" / experiment,\\\\n Path(root) / \\\\\"outputs/oof\\\\\" / f\\\\\"{experiment}.csv\\\\\",\\\\n Path(root) / \\\\\"outputs/predictions\\\\\" / f\\\\\"{experiment}.csv\\\\\"):\\\\n if artifact.exists():\\\\n raise FileExistsError(f\\\\\"Existing artifact reserves this experiment ID: {artifact}\\\\\")\\\\n record = {\\\\\"experiment_id\\\\\": experiment, \\\\\"timestamp\\\\\": now(), \\\\\"status\\\\\": \\\\\"running\\\\\",\\\\n \\\\\"hypothesis\\\\\": hypothesis, \\\\\"change_description\\\\\": change, \\\\\"parent_experiment\\\\\": parent,\\\\n \\\\\"model\\\\\": config.model, \\\\\"config\\\\\": config.to_dict(), \\\\\"parameters\\\\\": config.model_params,\\\\n \\\\\"validation_method\\\\\": config.validation_type, \\\\\"n_folds\\\\\": config.n_splits, \\\\\"seed\\\\\": config.seed,\\\\n \\\\\"provenance_path\\\\\": f\\\\\"outputs/reports/{experiment}/\\\\\", **git_info(root)}\\\\n save_json(path, record, exclusive=True)\\\\n update_tracker(root, record)\\\\n return record\\\\n\\\\n\\\\ndef finish_record(root, record):\\\\n save_json(report_path(root, record[\\\\\"experiment_id\\\\\"]), record)\\\\n update_tracker(root, record)\\\\n\\\\n\\\\ndef save_frame(path, frame):\\\\n path = Path(path)\\\\n path.parent.mkdir(parents=True, exist_ok=True)\\\\n with path.open(\\\\\"x\\\\\", newline=\\\\\"\\\\\", encoding=\\\\\"utf-8\\\\\") as handle:\\\\n frame.to_csv(handle, index=False, lineterminator=\\\\\"\\\\\\\\n\\\\\")\\\\n\\\\n\\\\ndef checked_record(root, experiment):\\\\n record = read_json(report_path(root, experiment))\\\\n if record[\\\\\"status\\\\\"] != \\\\\"completed\\\\\":\\\\n raise ValueError(f\\\\\"{experiment} is not completed\\\\\")\\\\n return record\\\\n\",\\n \"validation.py\": \"\\\\\"\\\\\"\\\\\"Explicit validation only. No dataset heuristic selects a splitter.\\\\\"\\\\\"\\\\\"\\\\nfrom pathlib import Path\\\\nimport warnings\\\\nimport numpy as np\\\\nimport pandas as pd\\\\nfrom sklearn import model_selection\\\\nfrom .utils import object_hash, read_json, save_json\\\\n\\\\n\\\\ndef split_settings(config):\\\\n keys = [\\\\\"validation_type\\\\\", \\\\\"validation_rationale\\\\\", \\\\\"n_splits\\\\\", \\\\\"shuffle\\\\\", \\\\\"seed\\\\\",\\\\n \\\\\"group_column\\\\\", \\\\\"time_column\\\\\", \\\\\"time_gap\\\\\", \\\\\"target\\\\\"]\\\\n return {key: getattr(config, key) for key in keys}\\\\n\\\\n\\\\ndef make_splits(frame, config, fingerprint, *, save_to=None, reuse=None):\\\\n kind, n = config.validation_type, len(frame)\\\\n if not kind or not config.n_splits:\\\\n raise ValueError(\\\\\"Validation strategy and n_splits must be explicitly configured\\\\\")\\\\n settings = split_settings(config)\\\\n groups = None\\\\n if kind in {\\\\\"group\\\\\", \\\\\"stratified_group\\\\\"}:\\\\n if not config.group_column or config.group_column not in frame:\\\\n raise ValueError(\\\\\"Group validation requires an existing group_column\\\\\")\\\\n groups = frame[config.group_column]\\\\n if groups.isna().any() or groups.nunique() < config.n_splits:\\\\n raise ValueError(\\\\\"Groups must be nonmissing with at least n_splits unique groups\\\\\")\\\\n y = frame[config.target]\\\\n if kind in {\\\\\"stratified\\\\\", \\\\\"stratified_group\\\\\"}:\\\\n if config.task != \\\\\"classification\\\\\" or y.value_counts().min() < config.n_splits:\\\\n raise ValueError(\\\\\"Stratification requires classification and at least n_splits rows per class\\\\\")\\\\n times = None\\\\n if kind == \\\\\"time\\\\\":\\\\n if config.shuffle or not config.time_column or config.time_column not in frame:\\\\n raise ValueError(\\\\\"Time validation requires time_column and shuffle=false\\\\\")\\\\n values = frame[config.time_column]\\\\n times = values if pd.api.types.is_numeric_dtype(values) else pd.to_datetime(values, errors=\\\\\"raise\\\\\", utc=True)\\\\n if times.isna().any():\\\\n raise ValueError(\\\\\"Time column contains missing values\\\\\")\\\\n differences = times.sort_values().diff().dropna()\\\\n if differences.nunique() > 1:\\\\n warnings.warn(\\\\\"Irregular timestamps: TimeSeriesSplit uses row counts, not elapsed durations.\\\\\")\\\\n if times.duplicated().any():\\\\n warnings.warn(\\\\\"Repeated timestamps detected; tied train/validation boundaries will be rejected.\\\\\")\\\\n if reuse:\\\\n payload = read_json(reuse)\\\\n if payload[\\\\\"data_fingerprint\\\\\"] != fingerprint or payload[\\\\\"settings\\\\\"] != settings:\\\\n raise ValueError(\\\\\"Saved splits do not match this dataset/order or validation configuration\\\\\")\\\\n pairs = [(np.array(p[\\\\\"train\\\\\"], dtype=int), np.array(p[\\\\\"valid\\\\\"], dtype=int)) for p in payload[\\\\\"splits\\\\\"]]\\\\n else:\\\\n common = {\\\\\"n_splits\\\\\": config.n_splits}\\\\n random = {\\\\\"shuffle\\\\\": config.shuffle, \\\\\"random_state\\\\\": config.seed if config.shuffle else None}\\\\n if kind == \\\\\"kfold\\\\\":\\\\n splitter = model_selection.KFold(**common, **random)\\\\n elif kind == \\\\\"stratified\\\\\":\\\\n splitter = model_selection.StratifiedKFold(**common, **random)\\\\n elif kind == \\\\\"group\\\\\":\\\\n if config.shuffle:\\\\n raise ValueError(\\\\\"This portable GroupKFold adapter requires shuffle=false\\\\\")\\\\n splitter = model_selection.GroupKFold(**common)\\\\n elif kind == \\\\\"stratified_group\\\\\":\\\\n cls = getattr(model_selection, \\\\\"StratifiedGroupKFold\\\\\", None)\\\\n if cls is None:\\\\n raise ImportError(\\\\\"Installed scikit-learn lacks StratifiedGroupKFold; no fallback was selected\\\\\")\\\\n splitter = cls(**common, **random)\\\\n elif kind == \\\\\"time\\\\\":\\\\n splitter = model_selection.TimeSeriesSplit(**common, gap=config.time_gap)\\\\n else:\\\\n raise ValueError(\\\\\"validation_type must be kfold, stratified, group, stratified_group, or time\\\\\")\\\\n order = np.argsort(times.to_numpy(), kind=\\\\\"stable\\\\\") if times is not None else np.arange(n)\\\\n pairs = [(order[a], order[b]) for a, b in splitter.split(frame.iloc[order], y.iloc[order], groups)]\\\\n if len(pairs) != config.n_splits:\\\\n raise ValueError(\\\\\"Saved split count differs from configured n_splits\\\\\")\\\\n assignment = np.full(n, -1, dtype=int)\\\\n for fold, (train, valid) in enumerate(pairs):\\\\n for indices in (train, valid):\\\\n if indices.ndim != 1 or not len(indices) or len(np.unique(indices)) != len(indices) or indices.min() < 0 or indices.max() >= n:\\\\n raise ValueError(\\\\\"Invalid or duplicated split indices\\\\\")\\\\n if np.intersect1d(train, valid).size or (assignment[valid] != -1).any():\\\\n raise ValueError(\\\\\"Overlapping training/validation indices or repeated OOF assignment\\\\\")\\\\n if groups is not None and set(groups.iloc[train]) & set(groups.iloc[valid]):\\\\n raise ValueError(\\\\\"Groups cross the train/validation boundary\\\\\")\\\\n if times is not None and times.iloc[train].max() >= times.iloc[valid].min():\\\\n raise ValueError(\\\\\"Temporal overlap or tied timestamp at fold boundary; decide a suitable time/group strategy\\\\\")\\\\n if config.task == \\\\\"classification\\\\\" and set(y.iloc[train]) != set(config.class_order):\\\\n raise ValueError(f\\\\\"Fold {fold} training data lacks a configured class; revise validation explicitly\\\\\")\\\\n assignment[valid] = fold\\\\n if kind != \\\\\"time\\\\\" and (assignment == -1).any():\\\\n raise ValueError(\\\\\"Non-temporal CV must cover every row exactly once\\\\\")\\\\n payload = {\\\\\"settings\\\\\": settings, \\\\\"data_fingerprint\\\\\": fingerprint,\\\\n \\\\\"splits\\\\\": [{\\\\\"train\\\\\": a.tolist(), \\\\\"valid\\\\\": b.tolist()} for a, b in pairs],\\\\n \\\\\"fold_assignment\\\\\": assignment.tolist()}\\\\n payload[\\\\\"signature\\\\\"] = object_hash(payload)\\\\n if reuse and payload[\\\\\"signature\\\\\"] != read_json(reuse).get(\\\\\"signature\\\\\"):\\\\n raise ValueError(\\\\\"Saved split integrity check failed\\\\\")\\\\n if save_to:\\\\n save_json(save_to, payload, exclusive=True)\\\\n return pairs, assignment, payload\\\\n\"\\n },\\n \"splits\": {\\n \"settings\": {\\n \"validation_type\": \"stratified\",\\n \"validation_rationale\": \"Synthetic plumbing test only, no competition strategy\",\\n \"n_splits\": 2,\\n \"shuffle\": true,\\n \"seed\": 42,\\n \"group_column\": null,\\n \"time_column\": null,\\n \"time_gap\": 0,\\n \"target\": \"target\"\\n },\\n \"data_fingerprint\": {\\n \"sha256\": \"4067e6dafc6273831818ce5ada6e6a7ae38c5955e9c37c317dbb02852a753959\",\\n \"rows\": 12,\\n \"columns\": [\\n \"id\",\\n \"number\",\\n \"category\",\\n \"target\"\\n ]\\n },\\n \"splits\": [\\n {\\n \"train\": [\\n 1,\\n 4,\\n 8,\\n 9,\\n 10,\\n 11\\n ],\\n \"valid\": [\\n 0,\\n 2,\\n 3,\\n 5,\\n 6,\\n 7\\n ]\\n },\\n {\\n \"train\": [\\n 0,\\n 2,\\n 3,\\n 5,\\n 6,\\n 7\\n ],\\n \"valid\": [\\n 1,\\n 4,\\n 8,\\n 9,\\n 10,\\n 11\\n ]\\n }\\n ],\\n \"fold_assignment\": [\\n 0,\\n 1,\\n 0,\\n 0,\\n 1,\\n 0,\\n 0,\\n 0,\\n 1,\\n 1,\\n 1,\\n 1\\n ],\\n \"signature\": \"2cb6d6de7c2ff425d26471c264ed118ac445903a9a2f0dae1a4622182141af85\"\\n },\\n \"environment\": {\\n \"python\": \"3.14.4\",\\n \"platform\": \"Windows-11-10.0.26200-SP0\",\\n \"packages\": {\\n \"cloudpi